appId: dev.yosup.client
productName: Yo
copyright: Copyright © 2026 Glyphh AI

mac:
  category: public.app-category.developer-tools
  # Build both Apple Silicon (arm64) and Intel (x64) so users on
  # 2019/2020-era Intel Macs can run Yo. ${arch} in artifactName keeps
  # the two variants from colliding on filename.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  notarize: true
  artifactName: "Yo-${arch}.${ext}"

win:
  target:
    - nsis
  icon: assets/icon.png
  artifactName: "Yo-Setup.${ext}"

directories:
  output: release
  buildResources: assets

files:
  - dist/**/*
  - package.json

asarUnpack:
  - node_modules/@anthropic-ai/claude-agent-sdk-*/**/*
  - node_modules/@anthropic-ai/claude-agent-sdk/**/*
  - node_modules/better-sqlite3/**/*
  - node_modules/node-pty/**/*
  - node_modules/onnxruntime-node/**/*

publish:
  provider: github
  owner: glyphh-ai
  repo: yo-releases
