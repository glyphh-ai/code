<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  /* Two small palettes so the chrome matches the app theme. The center of the
     window is covered by the content BrowserView, so only the titlebar + the
     `frame`-px border are ever visible. */
  :root {
    --cw-bg: #f4f4f5;
    --cw-tb: #e9e9ec;
    --cw-border: rgba(0,0,0,.14);
    --cw-text: #2b2b30;
    --cw-faint: #8a8a93;
    --cw-accent: #4f46e5;
    --cw-btn-hover: rgba(0,0,0,.08);
  }
  html.dark {
    --cw-bg: #1c1c20;
    --cw-tb: #26262b;
    --cw-border: rgba(255,255,255,.12);
    --cw-text: #e6e6ea;
    --cw-faint: #8a8a93;
    --cw-accent: #7c74ff;
    --cw-btn-hover: rgba(255,255,255,.10);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

  /* Full-rect window frame. The content view sits on top of this, inset by the
     titlebar height and the frame, so this only shows as a titlebar + border. */
  #cw {
    position: absolute; inset: 0;
    background: var(--cw-bg);
    border: 1px solid var(--cw-border);
    border-radius: 0;
    overflow: hidden;
  }
  #cw.active { border-color: color-mix(in srgb, var(--cw-accent) 70%, var(--cw-border)); }

  #titlebar {
    position: absolute; top: 0; left: 0; right: 0;
    height: 30px;
    display: flex; align-items: center; gap: 7px;
    padding: 0 8px;
    background: var(--cw-tb);
    border-bottom: 1px solid var(--cw-border);
    cursor: default;
    user-select: none;
  }
  #fav { width: 14px; height: 14px; border-radius: 3px; object-fit: contain; flex: 0 0 auto; }
  #fav-initial {
    width: 14px; height: 14px; border-radius: 3px; flex: 0 0 auto;
    display: none; align-items: center; justify-content: center;
    background: var(--cw-accent); color: #fff; font-size: 9px; font-weight: 700;
  }
  #title {
    font-size: 12px; color: var(--cw-text); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 0;
  }
  .tb-btn {
    flex: 0 0 auto; width: 20px; height: 20px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--cw-faint); cursor: pointer;
  }
  .tb-btn:hover { background: var(--cw-btn-hover); color: var(--cw-text); }
  .tb-btn.active { background: var(--cw-btn-hover); color: var(--cw-accent); }
  .tb-btn svg { width: 13px; height: 13px; }

  /* Browser URL bar — shown only for browser windows, in the strip the content
     view is inset below (see CANVAS_URLBAR_H). Inset by the frame so the
     left/right resize hotspots stay clickable. */
  #urlbar {
    position: absolute; top: 30px; left: 8px; right: 8px; height: 36px;
    display: none; align-items: center; gap: 4px; padding: 0 4px;
    background: var(--cw-bg); border-bottom: 1px solid var(--cw-border);
  }
  #cw.urlbar-open #urlbar { display: flex; }
  .ub-btn {
    flex: 0 0 auto; width: 24px; height: 24px; border-radius: 5px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: var(--cw-faint); cursor: pointer;
  }
  .ub-btn:hover { background: var(--cw-btn-hover); color: var(--cw-text); }
  .ub-btn svg { width: 14px; height: 14px; }
  #ub-input {
    flex: 1 1 auto; min-width: 0; height: 25px; border-radius: 6px;
    border: 1px solid var(--cw-border); background: var(--cw-tb); color: var(--cw-text);
    font-size: 12px; padding: 0 9px; outline: none;
  }
  #ub-input:focus { border-color: color-mix(in srgb, var(--cw-accent) 70%, var(--cw-border)); }

  /* Resize hotspots live in the frame strips not covered by the content view. */
  .rz { position: absolute; }
  #rz-r  { top: 30px; right: 0; bottom: 0; width: 8px; cursor: ew-resize; }
  #rz-l  { top: 30px; left: 0; bottom: 0; width: 8px; cursor: ew-resize; }
  #rz-b  { left: 0; right: 0; bottom: 0; height: 8px; cursor: ns-resize; }
  #rz-br { right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize; }
  #rz-bl { left: 0; bottom: 0; width: 14px; height: 14px; cursor: nesw-resize; }
</style>
</head>
<body>
  <div id="cw">
    <div id="titlebar">
      <img id="fav" />
      <span id="fav-initial"></span>
      <span id="title"></span>
      <button class="tb-btn" id="btn-url" title="Toggle URL bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="3" y1="12" x2="21" y2="12"/><path d="M12 3a14 14 0 0 0 0 18 14 14 0 0 0 0-18"/></svg></button>
      <button class="tb-btn" id="btn-collapse" title="Collapse"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></button>
      <button class="tb-btn" id="btn-max" title="Expand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="1"/></svg></button>
      <button class="tb-btn" id="btn-close" title="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></button>
    </div>
    <div id="urlbar">
      <button class="ub-btn" id="ub-back" title="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
      <button class="ub-btn" id="ub-fwd" title="Forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
      <button class="ub-btn" id="ub-reload" title="Reload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg></button>
      <input id="ub-input" type="text" spellcheck="false" placeholder="Search or enter address" />
    </div>
    <div class="rz" id="rz-r"></div>
    <div class="rz" id="rz-l"></div>
    <div class="rz" id="rz-b"></div>
    <div class="rz" id="rz-br"></div>
    <div class="rz" id="rz-bl"></div>
  </div>

  <script>
    const api = window.canvasChrome;
    const cw = document.getElementById("cw");
    const fav = document.getElementById("fav");
    const favInitial = document.getElementById("fav-initial");
    const title = document.getElementById("title");
    const titlebar = document.getElementById("titlebar");
    const urlbar = document.getElementById("urlbar");
    const ubInput = document.getElementById("ub-input");

    // Browser URL bar wiring.
    ubInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); const v = ubInput.value.trim(); if (v) api.navTo(v); } });
    document.getElementById("ub-back").addEventListener("click", () => api.navBack());
    document.getElementById("ub-fwd").addEventListener("click", () => api.navForward());
    document.getElementById("ub-reload").addEventListener("click", () => api.navRefresh());

    function applyTheme(t) {
      const dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
    }
    api.getTheme().then(applyTheme).catch(() => {});
    api.onThemeChanged(applyTheme);

    api.onUpdate((u) => {
      title.textContent = u.name || api.id;
      cw.classList.toggle("active", !!u.active);
      titlebar.style.height = (u.titlebarH || 30) + "px";
      document.getElementById("rz-r").style.top = (u.titlebarH || 30) + "px";
      // URL bar — shown only when toggled on for this window (globe icon).
      cw.classList.toggle("urlbar-open", !!u.urlBarOpen);
      document.getElementById("btn-url").classList.toggle("active", !!u.urlBarOpen);
      if (u.urlBarOpen) {
        urlbar.style.top = (u.titlebarH || 30) + "px";
        urlbar.style.height = (u.urlBarH || 36) + "px";
        if (document.activeElement !== ubInput) ubInput.value = u.url || "";
      }
      const initial = (u.name || api.id || "?").charAt(0).toUpperCase();
      favInitial.textContent = initial;
      if (u.favicon) {
        fav.src = u.favicon;
        fav.style.display = "block";
        favInitial.style.display = "none";
        fav.onerror = () => { fav.style.display = "none"; favInitial.style.display = "flex"; };
      } else {
        fav.style.display = "none";
        favInitial.style.display = "flex";
      }
    });

    // Any press focuses the window. The titlebar starts a move; the resize
    // hotspots start a resize. The main process detaches the views and the main
    // renderer's DOM takes over the actual drag (so tracking stays smooth).
    // Main drives the live move/resize by polling the global cursor, so this
    // view only signals when a gesture starts and ends. Polling keeps the ghost
    // (and its titlebar / resize handle) pinned under the cursor, so the mouseup
    // that ends the gesture lands on this view.
    function endOnUp() {
      const onUp = () => { window.removeEventListener("mouseup", onUp); api.interactEnd(); };
      window.addEventListener("mouseup", onUp);
    }

    // A press on the titlebar only starts a move once the pointer moves past a
    // small threshold (click-and-hold-then-drag). A plain click just raises.
    titlebar.addEventListener("contextmenu", (e) => { e.preventDefault(); api.menu(); });
    titlebar.addEventListener("mousedown", (e) => {
      if (e.target.closest(".tb-btn")) return;
      if (e.button !== 0) return; // left-button only starts a move/click
      e.preventDefault();
      const cx = e.clientX, cy = e.clientY;
      let armed = false;
      const onMove = (ev) => {
        if (armed) return;
        if (Math.abs(ev.clientX - cx) <= 3 && Math.abs(ev.clientY - cy) <= 3) return;
        armed = true;
        api.moveStart(); // main begins polling the cursor from here
      };
      const onUp = () => {
        window.removeEventListener("mousemove", onMove);
        window.removeEventListener("mouseup", onUp);
        if (armed) api.interactEnd();
        else api.focus(); // plain click → just bring to front
      };
      window.addEventListener("mousemove", onMove);
      window.addEventListener("mouseup", onUp);
    });
    document.getElementById("btn-url").addEventListener("click", (e) => { e.stopPropagation(); api.toggleUrlbar(); });
    document.getElementById("btn-collapse").addEventListener("click", (e) => { e.stopPropagation(); api.button("collapse"); });
    document.getElementById("btn-max").addEventListener("click", (e) => { e.stopPropagation(); api.button("maximize"); });
    document.getElementById("btn-close").addEventListener("click", (e) => { e.stopPropagation(); api.button("close"); });
    for (const edge of ["r", "l", "b", "br", "bl"]) {
      document.getElementById("rz-" + edge).addEventListener("mousedown", (e) => {
        e.preventDefault();
        api.resizeStart(edge);
        endOnUp();
      });
    }

    // Listeners are wired — ask main for our current meta.
    api.ready();
  </script>
</body>
</html>
