<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline';" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;            /* show the rounded card, not a square */
      font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
      color: #e8e8ea;
      overflow: hidden;
    }
    #card {
      display: flex;
      flex-direction: column;
      background: rgba(20, 20, 24, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      box-sizing: border-box;
      min-height: 0;
      max-height: 600px;
      overflow: hidden;
    }
    #header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px 4px;
      font-size: 11px;
      color: #8a8a93;
      -webkit-user-select: none;
    }
    #trigger { color: #27c75e; font-weight: 600; font-family: ui-monospace, monospace; }
    #transcript {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 4px 12px 8px;
      font-size: 13px;
      line-height: 1.45;
    }
    .bubble { margin: 6px 0; white-space: pre-wrap; word-break: break-word; }
    .user { color: #aab0bd; }
    .user::before { content: "› "; color: #555; }
    .assistant { color: #e8e8ea; }
    .tool { color: #6f7585; font-size: 11px; font-style: italic; }
    #footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }
    #input {
      flex: 1 1 auto;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
    }
    #input:focus { border-color: rgba(39, 199, 94, 0.5); }
    button {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #e8e8ea;
      font-size: 12px;
      padding: 7px 12px;
      cursor: pointer;
    }
    button:hover { background: rgba(255, 255, 255, 0.12); }
    #insert { background: rgba(39, 199, 94, 0.18); border-color: rgba(39, 199, 94, 0.4); color: #27c75e; }
    #insert:disabled { opacity: 0.35; cursor: default; }
  </style>
</head>
<body>
  <div id="card">
    <div id="header">
      <span id="trigger">.yo</span>
      <span id="hint">Esc to close · Enter to send</span>
    </div>
    <div id="transcript"></div>
    <div id="footer">
      <input id="input" type="text" placeholder="Ask a follow-up…" autocomplete="off" />
      <button id="insert" disabled>Insert</button>
    </div>
  </div>
  <script src="prompt-bundle.js"></script>
</body>
</html>
