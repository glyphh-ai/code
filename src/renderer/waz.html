<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>.waz</title>
<link rel="stylesheet" href="styles.css">
<style>
  body {
    font-size: 13px;
    line-height: 1.5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--surface-2);
  }

  /* ── Header ─────────────────────────────────── */
  .waz-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-2);
    flex-shrink: 0;
    -webkit-app-region: drag;
  }
  .waz-title {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.02em;
    flex: 1;
  }
  .waz-title .waz-dot { color: var(--accent); }
  .waz-status {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--surface-3);
  }
  .waz-status.running { color: #ffb400; background: rgba(255,180,0,0.1); }
  .waz-status.done { color: var(--accent); background: rgba(37,199,94,0.08); }
  .waz-status.error { color: var(--danger); background: rgba(255,95,87,0.1); }
  .waz-btn {
    -webkit-app-region: no-drag;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    transition: color 0.15s;
  }
  .waz-btn:hover { color: var(--white); }
  .waz-btn.hidden { display: none; }

  /* ── Messages — reuse yo-panel-messages + yo-msg styles ── */
  .waz-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
  }

  /* ── Input — same as yo panel ── */
  .waz-input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    padding: 12px 14px 8px;
    border-top: 1px solid var(--border-2);
    flex-shrink: 0;
  }
  .waz-input-wrap textarea {
    flex: 1;
    background: var(--surface-3);
    border: 1px solid var(--border-3);
    border-radius: 12px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: var(--font-sans);
    resize: none;
    outline: none;
    max-height: 160px;
    min-height: 40px;
    height: 40px;
    line-height: 1.5;
    overflow-y: auto;
  }
  .waz-input-wrap textarea:focus { border-color: var(--accent); }
  .waz-input-wrap textarea::placeholder { color: var(--text-muted); }

  /* Send / Stop button — same as yo */
  .waz-send {
    background: var(--accent);
    color: #000;
    border: 2px solid transparent;
    box-sizing: border-box;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s, background 0.15s, color 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
  }
  .waz-send:hover { opacity: 0.8; }
  .waz-send.stop {
    background: transparent !important;
    border-color: var(--accent);
    color: transparent;
    position: relative;
    font-size: 0;
  }
  .waz-send.stop::before {
    content: "";
    display: block;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="waz-header">
  <span class="waz-title"><span class="waz-dot">.</span>waz</span>
  <span class="waz-status" id="status">ready</span>
  <button class="waz-btn" id="btn-min" title="Minimize">&#x2013;</button>
  <button class="waz-btn" id="btn-close" title="Close">&times;</button>
</div>

<div class="waz-messages" id="messages"></div>

<div class="waz-input-wrap">
  <textarea id="input" rows="1" placeholder=".waz ..."></textarea>
  <button class="waz-send" id="btn-send">&uarr;</button>
</div>

<script src="waz.js"></script>
</body>
</html>
