<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>.waz</title>
<link rel="stylesheet" href="styles.css">
<style>
  body {
    font-size: 13px;
    line-height: 1.5;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--surface-2);
  }

  /* ── Header (waz-specific — frameless window chrome) ── */
  .waz-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border-2);
    flex-shrink: 0;
    -webkit-app-region: drag;
  }
  .waz-title {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: -0.02em;
    flex: 1;
  }
  .waz-title .waz-dot { color: var(--accent); }
  .waz-status {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--surface-3);
  }
  .waz-status.running { color: #ffb400; background: rgba(255,180,0,0.1); }
  .waz-status.done { color: var(--accent); background: rgba(37,199,94,0.08); }
  .waz-status.error { color: var(--danger); background: rgba(255,95,87,0.1); }
  .waz-btn {
    -webkit-app-region: no-drag;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
    transition: color 0.15s;
  }
  .waz-btn:hover { color: var(--white); }

  /* ── Messages — same layout as yo panel ── */
  .waz-messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    position: relative;
  }

  /* ── Override yo-panel IDs to work with generic classes ── */
  #input {
    flex: 1;
    background: var(--surface-3);
    border: 1px solid var(--border-3);
    border-radius: 12px;
    padding: 10px 12px;
    color: var(--text);
    font-size: 13px;
    font-family: var(--font-sans);
    resize: none;
    outline: none;
    max-height: 160px;
    min-height: 40px;
    height: 40px;
    line-height: 1.5;
    overflow-y: auto;
  }
  #input:focus { border-color: var(--accent); }
  #input::placeholder { color: var(--text-muted); }

  #btn-send {
    background: var(--accent);
    color: #000;
    border: 2px solid transparent;
    box-sizing: border-box;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    transition: opacity 0.15s, background 0.15s, color 0.15s, border-color 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #btn-send:hover { opacity: 0.8; }
  #btn-send.stop {
    background: transparent !important;
    border-color: var(--accent);
    color: transparent;
    position: relative;
    font-size: 0;
  }
  #btn-send.stop::before {
    content: "";
    display: block;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="waz-header">
  <span class="waz-title"><span class="waz-dot">.</span>waz</span>
  <span class="waz-status" id="status">ready</span>
  <button class="waz-btn" id="btn-min" title="Minimize">&#x2013;</button>
  <button class="waz-btn" id="btn-close" title="Close">&times;</button>
</div>

<div class="waz-messages" id="messages"></div>

<div class="yo-panel-input-wrap">
  <textarea id="input" rows="1" placeholder=".waz ..."></textarea>
</div>
<div class="yo-panel-controls">
  <div id="waz-perm-dropdown" class="yo-mode-dropdown">
    <button id="waz-perm-trigger" class="yo-mode-trigger" title="Permissions">
      <span class="yo-perm-icon">&#x1F512;</span>
      <span class="yo-perm-label">ask</span>
      <span class="yo-mode-chevron">&#x25BE;</span>
    </button>
    <div id="waz-perm-menu" class="yo-mode-menu hidden">
      <div class="yo-perm-option" data-value="default">
        <span class="yo-mode-opt-icon">&#x1F512;</span>
        <div class="yo-mode-opt-text">
          <span class="yo-mode-opt-label">ask</span>
          <span class="yo-mode-opt-desc">confirms before acting</span>
        </div>
      </div>
      <div class="yo-perm-option" data-value="plan">
        <span class="yo-mode-opt-icon">&#x1F4CB;</span>
        <div class="yo-mode-opt-text">
          <span class="yo-mode-opt-label">plan</span>
          <span class="yo-mode-opt-desc">drafts a plan, no tools</span>
        </div>
      </div>
      <div class="yo-perm-option" data-value="acceptEdits">
        <span class="yo-mode-opt-icon">&#x26A1;</span>
        <div class="yo-mode-opt-text">
          <span class="yo-mode-opt-label">auto</span>
          <span class="yo-mode-opt-desc">runs safe tools, asks for risky</span>
        </div>
      </div>
      <div class="yo-perm-option" data-value="bypassPermissions">
        <span class="yo-mode-opt-icon">&#x1F525;</span>
        <div class="yo-mode-opt-text">
          <span class="yo-mode-opt-label">bypass</span>
          <span class="yo-mode-opt-desc">no prompts &mdash; use with care</span>
        </div>
      </div>
    </div>
  </div>
  <div class="yo-controls-spacer"></div>
  <button id="btn-send">&uarr;</button>
</div>

<script src="waz.js"></script>
</body>
</html>
