<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  :root {
    --dock-icon: 46px;
    --m: 1.6;            /* hover magnification factor (from config) */
    --tile-bg: color-mix(in srgb, #6b7280 22%, transparent);
    --tile-border: rgba(0,0,0,.14);
    --strip-bg: color-mix(in srgb, #f4f4f5 78%, transparent);
    --strip-border: rgba(0,0,0,.12);
    --accent: #4f46e5;
    --text-3: #8a8a93;
  }
  html.dark {
    --tile-bg: color-mix(in srgb, #9aa0aa 18%, transparent);
    --tile-border: rgba(255,255,255,.14);
    --strip-bg: color-mix(in srgb, #1c1c20 72%, transparent);
    --strip-border: rgba(255,255,255,.12);
    --accent: #7c74ff;
    --text-3: #8a8a93;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }

  /* The band fills the whole overlay window; the strip is pinned to the docked
     edge so magnified icons can overflow into the (click-through) rest. */
  #dock { position: absolute; inset: 0; pointer-events: none; }

  .dock-strip {
    position: absolute;
    display: flex;
    gap: 10px;
    padding: 8px 12px;
    background: var(--strip-bg);
    border: 1px solid var(--strip-border);
    border-radius: 18px;
    backdrop-filter: blur(22px) saturate(160%);
    box-shadow: 0 8px 30px rgba(0,0,0,.28);
    transition: transform .22s cubic-bezier(.2,.8,.2,1), opacity .18s ease;
    pointer-events: auto; /* interactive once the window stops ignoring mouse */
  }
  .dock-empty { color: var(--text-3); font-size: 12px; padding: 6px 10px; white-space: nowrap; }

  /* ── Position variants ── */
  [data-pos="bottom"] .dock-strip { left: 50%; bottom: 8px; transform: translateX(-50%); flex-direction: row;    align-items: flex-end; }
  [data-pos="top"]    .dock-strip { left: 50%; top: 8px;    transform: translateX(-50%); flex-direction: row;    align-items: flex-start; }
  [data-pos="left"]   .dock-strip { top: 50%; left: 8px;    transform: translateY(-50%); flex-direction: column; align-items: flex-start; }
  [data-pos="right"]  .dock-strip { top: 50%; right: 8px;   transform: translateY(-50%); flex-direction: column; align-items: flex-end; }

  /* Hidden (auto-hide) — slide the strip off the docked edge. */
  [data-pos="bottom"] .dock-strip.hidden { transform: translate(-50%, 130%); opacity: 0; }
  [data-pos="top"]    .dock-strip.hidden { transform: translate(-50%, -130%); opacity: 0; }
  [data-pos="left"]   .dock-strip.hidden { transform: translate(-130%, -50%); opacity: 0; }
  [data-pos="right"]  .dock-strip.hidden { transform: translate(130%, -50%); opacity: 0; }

  .dock-item {
    position: relative;
    width: var(--dock-icon); height: var(--dock-icon);
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; border: none;
    border-radius: calc(var(--dock-icon) * .26);
    background: var(--tile-bg);
    box-shadow: inset 0 0 0 1px var(--tile-border);
    /* JS sets transform from the polled cursor; a short transition smooths the
       steps between poll ticks. */
    transition: transform .1s ease-out;
    will-change: transform;
  }
  .dock-item .dock-icon-img { width: 100%; height: 100%; object-fit: contain; border-radius: inherit; }
  .dock-item .dock-icon-initial {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff; font-weight: 700; border-radius: inherit;
    font-size: calc(var(--dock-icon) * .42);
  }
  .dock-item.dock-dragging { opacity: .4; }
  .dock-x {
    position: absolute; top: -6px; right: -6px;
    width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid var(--strip-bg);
    background: #e5484d; color: #fff;
    display: none; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; z-index: 2;
  }
  .dock-x svg { width: 9px; height: 9px; }
  .dock-item--hot .dock-x { display: flex; }
  .dock-running-dot { position: absolute; border-radius: 50%; background: var(--text-3); width: 4px; height: 4px; }
  [data-pos="bottom"] .dock-running-dot { bottom: -5px; left: 50%; transform: translateX(-50%); }
  [data-pos="top"]    .dock-running-dot { top: -5px;    left: 50%; transform: translateX(-50%); }
  [data-pos="left"]   .dock-running-dot { left: -5px;   top: 50%;  transform: translateY(-50%); }
  [data-pos="right"]  .dock-running-dot { right: -5px;  top: 50%;  transform: translateY(-50%); }

  /* ── Magnification — transform-origin points away from the docked edge so the
        icon grows outward; the actual scale/spread is applied inline by JS from
        the polled cursor position (see dock-overlay-renderer.ts). ── */
  [data-pos="bottom"] .dock-item { transform-origin: bottom center; }
  [data-pos="top"]    .dock-item { transform-origin: top center; }
  [data-pos="left"]   .dock-item { transform-origin: left center; }
  [data-pos="right"]  .dock-item { transform-origin: right center; }
</style>
</head>
<body>
  <div id="dock" data-pos="bottom"><div class="dock-strip"></div></div>
  <script src="dock-overlay-renderer.js"></script>
</body>
</html>
