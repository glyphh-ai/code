<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Context</title>
<style>
  :root {
    --bg: #0e0f10;
    --surface: #161719;
    --surface-2: #1d1e21;
    --border: #2a2c30;
    --text: #d9d9d9;
    --text-2: #9aa0a6;
    --text-3: #6b7177;
    --accent: #25C75E;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --mono: 'SF Mono', 'Fira Code', monospace;
  }

  @media (prefers-color-scheme: light) {
    :root {
      --bg: #ffffff;
      --surface: #fafafa;
      --surface-2: #f4f4f5;
      --border: #e4e4e7;
      --text: #1f2937;
      --text-2: #4b5563;
      --text-3: #6b7280;
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    line-height: 1.5;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Header ─────────────────────────────── */
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
  }

  .workspace-input {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 6px 10px;
    width: 140px;
    outline: none;
    transition: border-color 0.15s;
  }
  .workspace-input:focus {
    border-color: var(--accent);
  }
  .workspace-input::placeholder {
    color: var(--text-3);
  }

  .search-input {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font);
    font-size: 13px;
    padding: 6px 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus {
    border-color: var(--accent);
  }
  .search-input::placeholder {
    color: var(--text-3);
  }

  .live-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-3);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .live-dot.active {
    background: var(--accent);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(37, 199, 94, 0.4); }
    50% { opacity: 0.8; box-shadow: 0 0 0 4px rgba(37, 199, 94, 0); }
  }

  /* ── Timeline ───────────────────────────── */
  .timeline {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .timeline::-webkit-scrollbar {
    width: 6px;
  }
  .timeline::-webkit-scrollbar-track {
    background: transparent;
  }
  .timeline::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 3px;
  }

  .entry {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.1s;
  }
  .entry:hover {
    background: var(--surface);
  }

  .entry-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }

  .source-badge {
    display: inline-flex;
    align-items: center;
    padding: 1px 7px;
    border-radius: 4px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    color: var(--text-2);
    text-transform: capitalize;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .entry-time {
    font-size: 11px;
    color: var(--text-2);
    margin-left: auto;
    white-space: nowrap;
  }

  .entry-snippet {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-2);
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 60px;
    overflow: hidden;
    position: relative;
  }
  .entry-snippet.clamped::after {
    content: "";
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 20px;
    background: linear-gradient(transparent, var(--bg));
  }
  .entry:hover .entry-snippet.clamped::after {
    background: linear-gradient(transparent, var(--surface));
  }

  .entry-full {
    display: none;
    margin-top: 8px;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text);
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 400px;
    overflow-y: auto;
  }
  .entry.expanded .entry-full {
    display: block;
  }
  .entry.expanded .entry-snippet {
    display: none;
  }

  .entry-score {
    font-size: 10px;
    color: var(--text-3);
    margin-left: 6px;
  }

  /* ── Empty state ────────────────────────── */
  .empty-state {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    padding: 40px;
    text-align: center;
  }
  .empty-state p {
    color: var(--text-2);
    font-size: 14px;
    line-height: 1.7;
    max-width: 360px;
  }

  /* ── Status bar ─────────────────────────── */
  .status-bar {
    padding: 6px 16px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--text-3);
    background: var(--surface);
    flex-shrink: 0;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>

<div class="header">
  <input type="text" class="workspace-input" id="workspace" placeholder="workspace" spellcheck="false" />
  <input type="text" class="search-input" id="search" placeholder="Search captures..." spellcheck="false" />
  <div class="live-dot" id="liveDot" title="Live capture indicator"></div>
</div>

<div class="timeline" id="timeline"></div>

<div class="empty-state" id="emptyState" style="display:none;">
  <p>No context captured yet. Open some apps and start working — captures will appear here automatically.</p>
</div>

<div class="status-bar">
  <span id="statusCount">0 entries</span>
  <span id="statusWorkspace">default</span>
</div>

<script>
(function() {
  const yo = window.yo;
  const timeline = document.getElementById("timeline");
  const emptyState = document.getElementById("emptyState");
  const workspaceInput = document.getElementById("workspace");
  const searchInput = document.getElementById("search");
  const liveDot = document.getElementById("liveDot");
  const statusCount = document.getElementById("statusCount");
  const statusWorkspace = document.getElementById("statusWorkspace");

  let currentWorkspace = "default";
  let entries = [];
  let expandedIds = new Set();
  let fullContentCache = {};
  let searchMode = false;
  let pulseTimer = null;

  // ── Time formatting ──────────────────────
  function relativeTime(ts) {
    const diff = Date.now() - ts;
    if (diff < 60000) return "just now";
    if (diff < 3600000) return Math.floor(diff / 60000) + "m ago";
    if (diff < 86400000) return Math.floor(diff / 3600000) + "h ago";
    if (diff < 604800000) return Math.floor(diff / 86400000) + "d ago";
    return new Date(ts).toLocaleDateString();
  }

  // ── Clean source name ────────────────────
  function cleanSource(source) {
    // Strip URL path suffixes like "claude:chat:abc123" -> "claude"
    const base = source.split(":")[0];
    // Strip instance suffix like "gmail-2" -> "gmail"
    const dash = base.lastIndexOf("-");
    if (dash > 0 && /^\d+$/.test(base.slice(dash + 1))) {
      return base.slice(0, dash);
    }
    return base;
  }

  // ── Render ───────────────────────────────
  function renderEntries(list, isSearch) {
    entries = list;
    timeline.innerHTML = "";

    if (list.length === 0) {
      timeline.style.display = "none";
      emptyState.style.display = "flex";
      if (isSearch) {
        emptyState.querySelector("p").textContent = "No results found.";
      } else {
        emptyState.querySelector("p").textContent =
          "No context captured yet. Open some apps and start working — captures will appear here automatically.";
      }
      statusCount.textContent = "0 entries";
      return;
    }

    timeline.style.display = "";
    emptyState.style.display = "none";
    statusCount.textContent = list.length + " entr" + (list.length === 1 ? "y" : "ies");

    for (const entry of list) {
      const el = document.createElement("div");
      el.className = "entry" + (expandedIds.has(entry.id) ? " expanded" : "");
      el.dataset.id = entry.id;

      const snippetText = (entry.snippet || "").slice(0, 300);
      const needsClamp = snippetText.length >= 280;

      el.innerHTML =
        '<div class="entry-header">' +
          '<span class="source-badge">' + escapeHtml(cleanSource(entry.source)) + '</span>' +
          (entry.score != null ? '<span class="entry-score">' + (entry.score * 100).toFixed(0) + '%</span>' : '') +
          '<span class="entry-time">' + relativeTime(entry.created) + '</span>' +
        '</div>' +
        '<div class="entry-snippet' + (needsClamp ? ' clamped' : '') + '">' + escapeHtml(snippetText) + '</div>' +
        '<div class="entry-full">' + (fullContentCache[entry.id] ? escapeHtml(fullContentCache[entry.id]) : 'Loading...') + '</div>';

      el.addEventListener("click", () => toggleExpand(el, entry.id));
      timeline.appendChild(el);
    }
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  // ── Expand/collapse ──────────────────────
  async function toggleExpand(el, id) {
    if (expandedIds.has(id)) {
      expandedIds.delete(id);
      el.classList.remove("expanded");
      return;
    }

    expandedIds.add(id);
    el.classList.add("expanded");

    if (!fullContentCache[id]) {
      try {
        const content = await yo.contextRead(id);
        fullContentCache[id] = content || "(empty)";
        const fullEl = el.querySelector(".entry-full");
        if (fullEl) fullEl.textContent = fullContentCache[id];
      } catch {
        const fullEl = el.querySelector(".entry-full");
        if (fullEl) fullEl.textContent = "(failed to load)";
      }
    }
  }

  // ── Load entries ─────────────────────────
  async function loadRecent() {
    searchMode = false;
    searchInput.value = "";
    try {
      const list = await yo.contextRecent(currentWorkspace, 50);
      renderEntries(list, false);
    } catch (e) {
      console.error("[context] loadRecent failed:", e);
    }
  }

  // ── Search ───────────────────────────────
  let searchTimer = null;
  searchInput.addEventListener("input", () => {
    clearTimeout(searchTimer);
    const query = searchInput.value.trim();
    if (!query) {
      loadRecent();
      return;
    }
    searchTimer = setTimeout(async () => {
      searchMode = true;
      try {
        const results = await yo.contextSearch(currentWorkspace, query, 20);
        renderEntries(results, true);
      } catch (e) {
        console.error("[context] search failed:", e);
      }
    }, 300);
  });

  // ── Workspace change ─────────────────────
  let wsTimer = null;
  workspaceInput.addEventListener("input", () => {
    clearTimeout(wsTimer);
    wsTimer = setTimeout(() => {
      const name = workspaceInput.value.trim() || "default";
      if (name === currentWorkspace) return;
      currentWorkspace = name;
      statusWorkspace.textContent = currentWorkspace;
      yo.workspaceSet(currentWorkspace).catch(() => {});
      expandedIds.clear();
      fullContentCache = {};
      loadRecent();
    }, 500);
  });

  workspaceInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      clearTimeout(wsTimer);
      const name = workspaceInput.value.trim() || "default";
      currentWorkspace = name;
      statusWorkspace.textContent = currentWorkspace;
      yo.workspaceSet(currentWorkspace).catch(() => {});
      expandedIds.clear();
      fullContentCache = {};
      loadRecent();
      searchInput.focus();
    }
  });

  // ── Live updates ─────────────────────────
  yo.onContextUpdate((entry) => {
    // Pulse the live dot
    liveDot.classList.add("active");
    clearTimeout(pulseTimer);
    pulseTimer = setTimeout(() => liveDot.classList.remove("active"), 3000);

    // Only prepend if we match the current workspace (or entry has no workspace)
    if (entry.workspace && entry.workspace !== currentWorkspace) return;
    if (searchMode) return;

    const newEntry = {
      id: entry.id,
      source: entry.source,
      created: entry.created,
      workspace: entry.workspace,
      snippet: "(new capture)",
    };

    entries.unshift(newEntry);
    renderEntries(entries, false);
  });

  // ── Init ─────────────────────────────────
  async function init() {
    try {
      currentWorkspace = await yo.workspaceGet();
    } catch {
      currentWorkspace = "default";
    }
    workspaceInput.value = currentWorkspace;
    statusWorkspace.textContent = currentWorkspace;
    loadRecent();
  }

  init();
})();
</script>
</body>
</html>
