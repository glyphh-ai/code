<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Welcome</title>
<link rel="stylesheet" href="styles.css">
<script>
  // Apply theme synchronously before first paint (matches home.html).
  // Reads from localStorage which the main renderer keeps in sync; falls
  // back to light when unset (e.g. brand-new install before any preference
  // has been written).
  try {
    var t = localStorage.getItem("yoTheme") || "light";
    var r = t === "system"
      ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
      : t;
    document.documentElement.setAttribute("data-theme", r);
  } catch (e) {}
</script>
<style>
  html, body { height: 100%; }
  body {
    font-size: 14px;
    line-height: 1.5;
    overflow-y: auto;
    overflow-x: hidden;
    /* Match the chrome (rail + active tab + titlebar sliver) so the
       page reads as a continuation of the top strip, not a dark gap. */
    background: var(--surface-2);
    color: var(--text);
    font-family: var(--font-sans);
  }

  .welcome-root {
    min-height: 100%;
    display: flex; flex-direction: column;
    align-items: center;
    padding: 64px 32px 32px 32px;
    gap: 48px;
  }

  /* Hero ─────────────────────────────────────────── */
  .welcome-hero {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .welcome-logo {
    font-family: var(--font-mono);
    font-size: 96px; font-weight: 800;
    letter-spacing: -0.06em;
    color: var(--text);
    user-select: none;
  }
  .welcome-logo .dot { color: var(--accent); }
  .welcome-tagline {
    font-size: 16px; color: var(--text-2);
    min-height: 22px;
    text-align: center;
    transition: opacity 240ms ease;
  }

  /* Two dev-plane cards ───────────────────────────── */
  .plane-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 16px; width: 100%; max-width: 720px;
  }
  .plane-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px 20px;
    cursor: pointer;
    text-align: left;
    transition: border-color 120ms ease, transform 120ms ease;
    display: flex; flex-direction: column; gap: 8px;
  }
  .plane-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .plane-card:disabled { cursor: not-allowed; opacity: 0.55; }
  .plane-card:disabled:hover { border-color: var(--border); transform: none; }
  .plane-name {
    font-family: var(--font-mono);
    font-size: 22px; font-weight: 700;
    letter-spacing: -0.02em;
  }
  .plane-name .dot { color: var(--accent); }
  .plane-desc { font-size: 13px; color: var(--text-2); }
  .plane-soon {
    margin-top: 6px;
    font-size: 11px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  /* Recents ──────────────────────────────────────── */
  .recents {
    width: 100%; max-width: 720px;
    display: flex; flex-direction: column; gap: 8px;
    position: relative;
  }
  .recents-header {
    display: flex; align-items: center; gap: 8px;
    padding: 0 4px;
  }
  .recents-title {
    font-size: 11px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .recents-spacer { flex: 1; }
  .recents-add {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-2);
    cursor: pointer;
    font-size: 14px; font-weight: 600; line-height: 1;
    transition: border-color 120ms ease, color 120ms ease;
  }
  .recents-add:hover { border-color: var(--accent); color: var(--accent); }
  .recents-add-menu {
    position: absolute;
    top: 32px; right: 4px;
    min-width: 140px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 8px 24px var(--overlay-bg);
    padding: 4px;
    z-index: 20;
    display: flex; flex-direction: column;
  }
  .recents-add-menu.hidden { display: none; }
  .recents-add-menu button {
    background: transparent; border: none;
    padding: 6px 10px;
    text-align: left;
    color: var(--text);
    font-family: inherit; font-size: 12px;
    cursor: pointer;
    border-radius: 4px;
  }
  .recents-add-menu button:hover { background: var(--surface); color: var(--accent); }
  .recents-search {
    width: 100%; box-sizing: border-box;
    padding: 6px 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: inherit; font-size: 12px;
    outline: none;
    transition: border-color 120ms ease;
  }
  .recents-search:focus { border-color: var(--accent); }
  .recents-list {
    display: flex; flex-direction: column; gap: 4px;
  }
  .recent-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 12px;
    border: 1px solid transparent;
    border-radius: 8px;
    cursor: pointer;
    background: transparent;
    text-align: left;
    color: var(--text);
    font-family: inherit; font-size: 13px;
    position: relative;
  }
  .recent-row:hover { background: var(--surface-2); border-color: var(--border); }
  .recent-content {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: 2px;
  }
  .recent-app {
    font-weight: 600; color: var(--text); font-size: 13px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .recent-folder {
    color: var(--text-3); font-size: 11px;
    font-family: var(--font-mono);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .recent-dismiss {
    width: 22px; height: 22px;
    border: none; border-radius: 4px;
    background: transparent; color: var(--text-3);
    cursor: pointer; font-size: 16px; line-height: 1;
    opacity: 0;
    transition: opacity 120ms ease, background 120ms ease, color 120ms ease;
  }
  .recent-row:hover .recent-dismiss { opacity: 1; }
  .recent-dismiss:hover { background: var(--surface); color: var(--text); }
  .recent-empty {
    padding: 16px;
    color: var(--text-3);
    font-size: 13px;
    text-align: center;
    border: 1px dashed var(--border);
    border-radius: 8px;
  }
  .recents-more {
    align-self: center;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-2);
    font-family: inherit; font-size: 12px;
    cursor: pointer;
    transition: border-color 120ms ease, color 120ms ease;
  }
  .recents-more:hover { border-color: var(--accent); color: var(--accent); }

  /* Footer ────────────────────────────────────────── */
  .welcome-footer {
    margin-top: auto;
    padding-top: 32px;
    color: var(--text-3); font-size: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .welcome-footer input { margin: 0; }
</style>
</head>
<body>
  <div class="welcome-root">
    <div class="welcome-hero">
      <div class="welcome-logo"><span class="dot">.</span>Yo</div>
      <div class="welcome-tagline" id="welcome-tagline">your AI workspace</div>
    </div>

    <div class="plane-row">
      <button class="plane-card" id="card-vibe" type="button">
        <div class="plane-name"><span class="dot">.</span>Vibe</div>
        <div class="plane-desc">Spec-driven coding with Claude in your repo.</div>
      </button>
      <button class="plane-card" id="card-spec" type="button">
        <div class="plane-name"><span class="dot">.</span>Spec</div>
        <div class="plane-desc">The other half of dev — design + spec authoring.</div>
      </button>
    </div>

    <div class="recents">
      <div class="recents-header">
        <span class="recents-title">Recents</span>
        <span class="recents-spacer"></span>
        <button id="recents-add" class="recents-add" type="button" title="New Vibe or Spec">+</button>
      </div>
      <div id="recents-add-menu" class="recents-add-menu hidden">
        <button type="button" data-app="vibe">.Vibe</button>
        <button type="button" data-app="spec">.Spec</button>
      </div>
      <input id="recents-search" class="recents-search" type="text" placeholder="Search…" spellcheck="false" />
      <div class="recents-list" id="recents-list">
        <div class="recent-empty">No recents yet — open Vibe or Spec on a folder to start.</div>
      </div>
      <button id="recents-more" class="recents-more" type="button" style="display:none;">Show more</button>
    </div>

    <div class="welcome-footer">
      <label>
        <input type="checkbox" id="show-on-startup" checked />
        Show on startup
      </label>
    </div>
  </div>

  <script>
    (async () => {
      const api = window.welcome;
      if (api && api.getTheme) {
        const t = await api.getTheme();
        const resolved = t === "system"
          ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : t;
        document.documentElement.setAttribute("data-theme", resolved);
      }
      if (api && api.onThemeChanged) {
        api.onThemeChanged((theme) => {
          document.documentElement.setAttribute("data-theme", theme);
        });
      }
    })();
  </script>
  <script src="./welcome.js"></script>
</body>
</html>
