<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Swarm</title>
<link rel="stylesheet" href="styles.css">
<style>
  body {
    font-size: 14px; line-height: 1.5; overflow: hidden; margin: 0;
    display: flex; flex-direction: column; height: 100vh;
    background: var(--bg, #0e0e10); color: var(--text);
  }

  /* ── Top bar ───────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
    height: 44px; box-sizing: border-box;
  }
  .brand {
    font-family: var(--font-mono); font-size: 15px; font-weight: 800;
    color: var(--text); letter-spacing: -0.02em;
  }
  .brand .dot { color: #A855F7; }
  .topbar-title {
    font-size: 13px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 340px;
  }
  .topbar-goal {
    font-size: 12px; color: var(--text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1; min-width: 0;
  }
  .topbar-actions { display: flex; gap: 8px; }
  .tb-btn {
    font: inherit; font-size: 12px; font-weight: 600;
    padding: 5px 12px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-2, #1a1a1e);
    color: var(--text);
  }
  .tb-btn:hover { border-color: #A855F7; }
  .tb-btn.stop:hover { border-color: #f44; color: #f88; }
  .tb-btn:disabled { opacity: 0.4; cursor: default; }

  /* ── Layout: cards left, feed top-right, agents bottom-right ─ */
  .layout { flex: 1; display: flex; min-height: 0; }
  .col-cards {
    flex: 1; min-width: 0; position: relative;
    border-right: 1px solid var(--border); overflow: hidden;
  }
  .col-side {
    width: 380px; flex-shrink: 0; display: flex; flex-direction: column;
    min-height: 0;
  }
  .pane-feed {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    border-bottom: 1px solid var(--border);
  }
  .pane-agents {
    height: 240px; flex-shrink: 0; display: flex; flex-direction: column;
  }
  .pane-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; border-bottom: 1px solid var(--border);
    background: var(--surface); flex-shrink: 0;
  }
  .pane-head h3 {
    margin: 0; font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text-3);
  }
  .pane-head .count { font-size: 11px; color: var(--text-3); }

  /* ── Feed ──────────────────────────────────────────────── */
  .feed-list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .feed-empty { padding: 24px 16px; text-align: center; color: var(--text-3); font-size: 12px; }
  .feed-row {
    display: flex; gap: 8px; padding: 6px 12px; align-items: flex-start;
  }
  .feed-badge {
    width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: var(--surface-2, #1a1a1e); border: 1px solid var(--border);
  }
  .feed-badge img { width: 16px; height: 16px; object-fit: contain; }
  .feed-badge .member-badge-initial { font-size: 12px; font-weight: 700; color: var(--text-2); }
  .feed-body { flex: 1; min-width: 0; }
  .feed-meta { display: flex; gap: 6px; align-items: baseline; font-size: 11px; }
  .feed-from { font-weight: 700; color: var(--text); }
  .feed-to { color: var(--text-3); }
  .feed-kind {
    font-size: 9px; font-weight: 700; letter-spacing: 0.05em;
    text-transform: uppercase; padding: 1px 5px; border-radius: 3px;
  }
  .feed-time { color: var(--text-3); margin-left: auto; font-size: 10px; }
  .feed-text {
    font-size: 12px; color: var(--text-2); margin-top: 2px;
    word-break: break-word; white-space: pre-wrap;
  }

  /* ── Agents roster ─────────────────────────────────────── */
  .agent-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .agent-row {
    display: flex; gap: 8px; align-items: center; padding: 6px 12px;
  }
  .agent-badge {
    width: 24px; height: 24px; border-radius: 6px; flex-shrink: 0;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
    background: var(--surface-2, #1a1a1e); border: 1px solid var(--border);
  }
  .agent-badge img { width: 17px; height: 17px; object-fit: contain; }
  .agent-badge .member-badge-initial { font-size: 13px; font-weight: 700; color: var(--text-2); }
  .agent-info { flex: 1; min-width: 0; }
  .agent-name {
    font-size: 12px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .agent-sub { font-size: 10px; color: var(--text-3); }
  .agent-role-pill {
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    padding: 1px 5px; border-radius: 3px; letter-spacing: 0.04em;
  }
  .agent-role-pill.leader { background: rgba(168,85,247,0.18); color: #c98bf5; }
  .agent-role-pill.worker { background: var(--surface-2, #1a1a1e); color: var(--text-3); }
  .agent-status {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    background: var(--text-3);
  }
  .agent-status.running, .agent-status.starting { background: #4caf50; }
  .agent-status.waiting { background: #ffb400; }
  .agent-status.error { background: #f44; }
  .agent-status.idle, .agent-status.done { background: var(--text-3); }

  .empty-panel {
    flex: 1; display: flex; align-items: center; justify-content: center;
    text-align: center; color: var(--text-3); font-size: 13px; padding: 24px;
  }
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">swarm<span class="dot">.</span></span>
    <span class="topbar-title" id="swarm-title">No swarm running</span>
    <span class="topbar-goal" id="swarm-goal"></span>
    <div class="topbar-actions">
      <button class="tb-btn" id="btn-start-all" disabled>Start all</button>
      <button class="tb-btn stop" id="btn-stop-all" disabled>Stop all</button>
    </div>
  </div>

  <div class="layout">
    <div class="col-cards" id="cards-container">
      <div class="empty-panel" id="cards-empty">
        No swarm yet. Switch the .yo mode to <strong>swarm</strong> and ask it
        to spin one up.
      </div>
    </div>
    <div class="col-side">
      <div class="pane-feed">
        <div class="pane-head">
          <h3>Activity</h3>
          <span class="count" id="feed-count">0</span>
        </div>
        <div class="feed-list" id="feed-list">
          <div class="feed-empty" id="feed-empty">No activity yet</div>
        </div>
      </div>
      <div class="pane-agents">
        <div class="pane-head">
          <h3>Agents</h3>
          <span class="count" id="agent-count">0</span>
        </div>
        <div class="agent-list" id="agent-list"></div>
      </div>
    </div>
  </div>

  <script src="cypher.js"></script>
</body>
</html>
