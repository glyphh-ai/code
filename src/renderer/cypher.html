<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cypher</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { font-size: 14px; line-height: 1.5; overflow: hidden; }

  /* ── Top bar ───────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .brand {
    font-family: var(--font-mono); font-size: 16px; font-weight: 800;
    color: var(--text); letter-spacing: -0.02em;
  }
  .brand .dot { color: var(--accent); }
  .topbar-title {
    font-size: 13px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 300px;
  }
  .topbar-status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .topbar-status.live { background: var(--accent-glow); color: var(--accent); }
  .topbar-status.lobby { background: rgba(255,180,0,0.1); color: #ffb400; }
  .topbar-status .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; animation: pulse-anim 2s ease-in-out infinite;
  }
  @keyframes pulse-anim {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }
  .topbar-spacer { flex: 1; }
  .topbar-btn {
    padding: 5px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-2);
    cursor: pointer; transition: all 0.15s ease;
  }
  .topbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .topbar-btn.danger:hover { border-color: #f44; color: #f44; }

  /* ── Flow board (top strip) ────────────────────────────── */
  .flow-board {
    display: flex; gap: 2px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    height: 110px; min-height: 110px;
    overflow: hidden;
  }
  .flow-column {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    padding: 0 6px;
  }
  .flow-column-header {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-3);
    padding: 2px 4px 4px; border-bottom: 2px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  .flow-column-header .count {
    background: var(--surface-3); border-radius: 8px;
    padding: 0 5px; font-size: 9px; color: var(--text-2);
  }
  .flow-column-header.active { border-color: var(--accent); }
  .flow-column-header.done { border-color: #4caf50; }
  .flow-cards {
    flex: 1; overflow-y: auto; padding: 4px 0;
    display: flex; flex-direction: column; gap: 3px;
  }
  .flow-card {
    padding: 4px 8px; border-radius: 5px;
    background: var(--surface-2); border: 1px solid var(--border);
    font-size: 11px; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: all 0.2s ease;
    cursor: default;
  }
  .flow-card:hover { border-color: var(--accent); }
  .flow-card .card-assignee {
    font-size: 9px; color: var(--text-3); margin-top: 1px;
  }

  /* ── Main layout (below flow) ──────────────────────────── */
  .cypher-main {
    display: flex;
    height: calc(100vh - 49px - 110px);
    overflow: hidden;
  }

  /* ── Left sidebar: file tree + roster ──────────────────── */
  .left-panel {
    width: 240px; min-width: 200px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* File tree section */
  .file-section {
    flex: 1; display: flex; flex-direction: column;
    overflow: hidden; border-bottom: 1px solid var(--border);
  }
  .section-header {
    padding: 8px 12px 6px;
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-3);
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-search {
    margin: 0 8px 6px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 8px;
    font-size: 11px; color: var(--text); outline: none; width: calc(100% - 16px);
  }
  .section-search:focus { border-color: var(--accent); }
  .file-tree {
    flex: 1; overflow-y: auto; padding: 0 4px 8px;
    font-family: var(--font-mono); font-size: 12px;
  }
  .tree-item {
    display: flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 4px;
    cursor: default; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tree-item:hover { background: var(--surface-2); color: var(--text); }
  .tree-item.active { background: var(--accent-glow); color: var(--text); }
  .tree-item.dir { color: var(--text); font-weight: 600; }
  .tree-icon { width: 14px; text-align: center; flex-shrink: 0; font-size: 10px; }
  .tree-indent { display: inline-block; }

  /* Roster section */
  .roster-section {
    height: 180px; min-height: 120px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .roster-list {
    flex: 1; overflow-y: auto; padding: 4px 8px;
  }
  .roster-item {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 8px; border-radius: 6px;
    cursor: default; transition: background 0.12s ease;
  }
  .roster-item:hover { background: var(--surface-2); }
  .roster-item.active { background: var(--accent-glow); }
  .roster-name {
    font-size: 11px; font-weight: 600; color: var(--text);
    flex: 1; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .roster-role {
    font-size: 9px; color: var(--text-3);
  }
  .roster-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  }
  .roster-dot.idle { background: var(--text-3); }
  .roster-dot.running { background: #ffb400; animation: pulse-dot 1.2s ease-in-out infinite; }
  .roster-dot.waiting { background: #4caf50; box-shadow: 0 0 4px #4caf5088; }
  .roster-dot.starting { background: #ffb400; animation: pulse-dot 1.2s ease-in-out infinite; }
  .roster-dot.error { background: #f44; }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Center: Monaco viewer ─────────────────────────────── */
  .viewer-panel {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .viewer-tabs {
    display: flex; gap: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
  }
  .viewer-tab {
    padding: 6px 14px;
    font-size: 12px; color: var(--text-3);
    border-right: 1px solid var(--border);
    cursor: default; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.12s;
  }
  .viewer-tab:hover { color: var(--text); background: var(--surface-2); }
  .viewer-tab.active { color: var(--text); background: var(--bg); border-bottom: 2px solid var(--accent); }
  .viewer-tab .tab-close {
    font-size: 10px; opacity: 0; padding: 2px;
    border-radius: 3px; transition: opacity 0.1s;
  }
  .viewer-tab:hover .tab-close { opacity: 0.6; }
  .viewer-tab .tab-close:hover { opacity: 1; background: var(--surface-3); }
  .viewer-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-3); font-size: 13px;
  }
  #monaco-container {
    flex: 1; overflow: hidden;
  }
  /* Media viewer for non-code files */
  #media-viewer {
    flex: 1; overflow: auto; padding: 20px;
    display: none; align-items: center; justify-content: center;
  }
  #media-viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  #media-viewer audio { width: 80%; }
  #media-viewer video { max-width: 100%; max-height: 100%; border-radius: 8px; }

  /* ── Utilities ─────────────────────────────────────────── */
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <span class="brand"><span class="dot">.</span>cypher</span>
  <span class="topbar-title" id="cypher-title">—</span>
  <span class="topbar-status lobby" id="cypher-status">
    <span class="pulse"></span>
    <span id="cypher-status-text">lobby</span>
  </span>
  <span class="topbar-spacer"></span>
  <button class="topbar-btn" id="btn-spawn" title="Start agents">Spawn</button>
  <button class="topbar-btn danger" id="btn-leave" title="Leave cypher">Leave</button>
</div>

<!-- Flow board — compact live kanban -->
<div class="flow-board" id="flow-board">
  <div class="flow-column">
    <div class="flow-column-header">Backlog <span class="count" id="flow-count-backlog">0</span></div>
    <div class="flow-cards" id="flow-backlog"></div>
  </div>
  <div class="flow-column">
    <div class="flow-column-header active">In Progress <span class="count" id="flow-count-active">0</span></div>
    <div class="flow-cards" id="flow-active"></div>
  </div>
  <div class="flow-column">
    <div class="flow-column-header">Review <span class="count" id="flow-count-review">0</span></div>
    <div class="flow-cards" id="flow-review"></div>
  </div>
  <div class="flow-column">
    <div class="flow-column-header done">Done <span class="count" id="flow-count-done">0</span></div>
    <div class="flow-cards" id="flow-done"></div>
  </div>
</div>

<!-- Main area: left sidebar + viewer -->
<div class="cypher-main">

  <!-- Left: File tree + Roster -->
  <div class="left-panel">
    <div class="file-section">
      <div class="section-header">Files</div>
      <input type="text" class="section-search" id="file-search" placeholder="Search files..." />
      <div class="file-tree" id="file-tree"></div>
    </div>
    <div class="roster-section">
      <div class="section-header">Jammers</div>
      <input type="text" class="section-search" id="roster-search" placeholder="Search agents..." />
      <div class="roster-list" id="roster-list"></div>
    </div>
  </div>

  <!-- Center: Monaco viewer -->
  <div class="viewer-panel">
    <div class="viewer-tabs" id="viewer-tabs"></div>
    <div class="viewer-empty" id="viewer-empty">Select a file to view</div>
    <div id="monaco-container"></div>
    <div id="media-viewer"></div>
  </div>

</div>

<script src="monaco/loader.js"></script>
<script src="cypher.js"></script>
</body>
</html>
