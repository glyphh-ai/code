<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cypher</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { font-size: 14px; line-height: 1.5; overflow: hidden; margin: 0; display: flex; flex-direction: column; height: 100vh; }

  /* ── Top bar ───────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
    height: 42px; box-sizing: border-box;
  }
  .brand {
    font-family: var(--font-mono); font-size: 16px; font-weight: 800;
    color: var(--text); letter-spacing: -0.02em;
  }
  .brand .dot { color: var(--accent); }
  .topbar-title {
    font-size: 13px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 300px;
  }
  .topbar-status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .topbar-status.live { background: var(--accent-glow); color: var(--accent); }
  .topbar-status.lobby { background: rgba(255,180,0,0.1); color: #ffb400; }
  .topbar-status .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; animation: pulse-anim 2s ease-in-out infinite;
  }
  @keyframes pulse-anim {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }
  .topbar-tokens {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'Press Start 2P', 'SF Mono', monospace;
    padding: 4px 14px; border-radius: 6px;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .topbar-tokens:empty { display: none; }
  .token-in {
    font-size: 16px; font-weight: 800; color: #4caf50;
    letter-spacing: 0.04em;
  }
  .token-out {
    font-size: 16px; font-weight: 800; color: #ff9800;
    letter-spacing: 0.04em;
  }
  .token-label {
    font-size: 8px; font-weight: 700; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .token-sep {
    font-size: 12px; color: var(--text-3); opacity: 0.4;
  }
  .topbar-spacer { flex: 1; }
  .topbar-btn {
    padding: 5px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-2);
    cursor: pointer; transition: all 0.15s ease;
  }
  .topbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .topbar-btn.danger:hover { border-color: #f44; color: #f44; }

  /* ── Workspace (3-column layout) ──────────────────────── */
  .workspace {
    display: flex;
    height: calc(100vh - 42px);
    overflow: hidden;
  }

  .col {
    display: flex; flex-direction: column;
    overflow: hidden;
    min-width: 0;
  }
  .col-left { width: 220px; min-width: 140px; max-width: 400px; }
  .col-center { flex: 1; min-width: 200px; }
  .col-right { width: 280px; min-width: 160px; max-width: 500px; }
  .col-left.collapsed, .col-right.collapsed {
    width: 0 !important; min-width: 0 !important;
    overflow: hidden;
  }

  /* ── Vertical splitter (between columns) ──────────────── */
  .vsplit {
    width: 5px; min-width: 5px;
    cursor: col-resize;
    background: var(--border);
    transition: background 0.15s;
    flex-shrink: 0;
    position: relative;
  }
  .vsplit:hover, .vsplit.dragging { background: var(--accent); }

  /* ── Horizontal splitter (within a column) ────────────── */
  .hsplit {
    height: 5px; min-height: 5px;
    cursor: row-resize;
    background: var(--border);
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .hsplit:hover, .hsplit.dragging { background: var(--accent); }

  /* ── Pane (generic panel within a column) ─────────────── */
  .pane {
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .pane-top { flex: 1; }
  .pane-bottom { flex: 1; }

  .pane-header {
    padding: 6px 12px;
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-3);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  .pane-header .count {
    background: var(--surface-3); border-radius: 8px;
    padding: 1px 6px; font-size: 10px; color: var(--text-2);
  }

  /* ── Files pane (left top) ────────────────────────────── */
  .pane-search {
    margin: 6px 8px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: 5px; padding: 4px 8px;
    font-size: 11px; color: var(--text); outline: none;
    width: calc(100% - 16px); box-sizing: border-box;
  }
  .pane-search:focus { border-color: var(--accent); }

  .file-tree {
    flex: 1; overflow-y: auto; padding: 0 4px 8px;
    font-family: var(--font-mono); font-size: 12px;
  }
  .tree-item {
    display: flex; align-items: center; gap: 4px;
    padding: 2px 8px; border-radius: 4px;
    cursor: default; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tree-item:hover { background: var(--surface-2); color: var(--text); }
  .tree-item.active { background: var(--accent-glow); color: var(--text); }
  .tree-item.dir { color: var(--text); font-weight: 600; }
  .tree-icon { width: 14px; text-align: center; flex-shrink: 0; font-size: 10px; }
  .tree-indent { display: inline-block; }

  /* ── Jammers pane (left bottom) ───────────────────────── */
  .jammer-search {
    display: block; width: calc(100% - 16px); margin: 4px 8px;
    padding: 4px 8px; border-radius: 4px;
    font-size: 11px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
    outline: none; font-family: inherit;
  }
  .jammer-search:focus { border-color: var(--accent); }
  .jammer-list {
    flex: 1; overflow-y: auto; padding: 4px;
  }
  .jammer-row {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 8px; border-radius: 6px;
    cursor: default; transition: background 0.12s;
  }
  .jammer-row:hover { background: var(--surface-2); }
  .jammer-avatar {
    width: 24px; height: 24px; border-radius: 6px;
    flex-shrink: 0; background: var(--surface-3);
    overflow: hidden;
  }
  .jammer-avatar img, .jammer-avatar svg {
    width: 100%; height: 100%; display: block; object-fit: cover;
  }
  .jammer-info { flex: 1; min-width: 0; }
  .jammer-name {
    font-size: 12px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .jammer-role {
    font-size: 10px; color: var(--text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .jammer-controls {
    display: flex; align-items: center; gap: 2px;
    opacity: 0; transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .jammer-row:hover .jammer-controls { opacity: 1; }
  .jammer-stop-btn, .jammer-msg-btn {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid transparent; border-radius: 4px;
    background: transparent; color: var(--text-3);
    cursor: pointer; font-size: 10px;
    transition: all 0.12s; padding: 0;
  }
  .jammer-stop-btn:hover { background: rgba(244,68,68,0.15); color: #f44; border-color: rgba(244,68,68,0.3); }
  .jammer-msg-btn:hover { background: var(--surface-3); color: var(--text); border-color: var(--border); }
  .jammer-tokens {
    font-family: 'Press Start 2P', 'SF Mono', monospace;
    font-size: 9px; font-weight: 800; color: var(--accent);
    letter-spacing: 0.02em;
  }
  .jammer-status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .jammer-status-dot.idle { background: var(--text-3); }
  .jammer-status-dot.running { background: #ffb400; animation: pulse-anim 2s ease-in-out infinite; }
  .jammer-status-dot.waiting { background: #4caf50; }
  .jammer-status-dot.starting { background: #ffb400; animation: pulse-anim 1s ease-in-out infinite; }
  .jammer-status-dot.error { background: #f44; }
  .jammer-msg-input-row {
    width: 100%; margin-top: 4px;
  }
  .jammer-msg-input {
    width: 100%; box-sizing: border-box;
    padding: 4px 8px; border-radius: 4px;
    font-size: 11px; border: 1px solid var(--accent);
    background: var(--surface-2); color: var(--text);
    outline: none; font-family: inherit;
  }

  .jammer-empty, .feed-empty {
    font-size: 11px; color: var(--text-3); padding: 20px 0; text-align: center;
  }
  .jammer-page-controls {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 4px 8px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }
  .jammer-page-btn {
    padding: 2px 8px; border-radius: 4px;
    font-size: 10px; font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-2);
    cursor: pointer;
  }
  .jammer-page-btn:hover { border-color: var(--accent); color: var(--accent); }
  .jammer-page-btn:disabled { opacity: 0.3; cursor: default; }
  .jammer-page-info {
    font-size: 10px; color: var(--text-3); font-family: var(--font-mono);
  }

  /* ── Center tabs (Board / Files) ────────────────────── */
  .center-tabs {
    display: flex; gap: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .center-tab {
    padding: 7px 20px;
    font-size: 12px; font-weight: 600; color: var(--text-3);
    border: none; border-bottom: 2px solid transparent;
    background: transparent; cursor: pointer; transition: all 0.15s;
  }
  .center-tab:hover { color: var(--text-2); }
  .center-tab.active { color: var(--text); border-bottom-color: var(--accent); }
  .center-pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Board view (kanban) ───────────────────────────────── */
  .board-view {
    flex: 1; display: flex; gap: 8px;
    padding: 12px; overflow-x: auto; overflow-y: hidden;
  }
  .board-column {
    flex: 1; min-width: 160px; max-width: 320px;
    display: flex; flex-direction: column;
    background: var(--surface); border-radius: 8px;
    border: 1px solid var(--border); overflow: hidden;
  }
  .board-col-header {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-3);
    padding: 10px 12px 8px;
    display: flex; align-items: center; gap: 8px;
    border-bottom: 2px solid var(--border);
  }
  .board-col-header .count {
    background: var(--surface-3); border-radius: 8px;
    padding: 1px 6px; font-size: 10px; color: var(--text-2);
  }
  .board-col-header.col-active { border-color: var(--accent); }
  .board-col-header.col-review { border-color: #ffb400; }
  .board-col-header.col-done { border-color: #4caf50; }
  .board-cards {
    flex: 1; overflow-y: auto; padding: 8px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .board-card {
    padding: 10px 12px; border-radius: 6px;
    background: var(--bg); border: 1px solid var(--border);
    transition: border-color 0.15s; cursor: default;
  }
  .board-card:hover { border-color: var(--accent); }
  .board-card-title {
    font-size: 12px; font-weight: 600; color: var(--text); line-height: 1.4;
  }
  .board-card-meta {
    display: flex; align-items: center; gap: 6px; margin-top: 6px;
  }
  .board-card-assignee {
    font-size: 10px; color: var(--text-3); font-family: var(--font-mono);
  }
  .board-card-avatar {
    width: 16px; height: 16px; border-radius: 4px;
    object-fit: cover; background: var(--surface-3); overflow: hidden;
  }
  .board-card-avatar img, .board-card-avatar svg {
    width: 100%; height: 100%; display: block; object-fit: cover;
  }
  .board-card-pr {
    font-size: 10px; color: var(--accent); text-decoration: none; margin-left: auto;
  }
  .board-empty {
    font-size: 11px; color: var(--text-3); padding: 12px 0; text-align: center;
  }

  /* ── Files view (Monaco viewer) ───────────────────────── */
  .viewer-tabs {
    display: flex; gap: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-shrink: 0;
  }
  .viewer-tab {
    padding: 6px 14px;
    font-size: 12px; color: var(--text-3);
    border-right: 1px solid var(--border);
    cursor: default; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
    transition: all 0.12s;
  }
  .viewer-tab:hover { color: var(--text); background: var(--surface-2); }
  .viewer-tab.active { color: var(--text); background: var(--bg); border-bottom: 2px solid var(--accent); }
  .viewer-tab .tab-close {
    font-size: 10px; opacity: 0; padding: 2px;
    border-radius: 3px; transition: opacity 0.1s;
  }
  .viewer-tab:hover .tab-close { opacity: 0.6; }
  .viewer-tab .tab-close:hover { opacity: 1; background: var(--surface-3); }
  .viewer-empty {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text-3); font-size: 13px;
  }
  #monaco-container { flex: 1; overflow: hidden; }
  #media-viewer {
    flex: 1; overflow: auto; padding: 20px;
    display: none; align-items: center; justify-content: center;
  }
  #media-viewer img { max-width: 100%; max-height: 100%; border-radius: 8px; }
  #media-viewer audio { width: 80%; }
  #media-viewer video { max-width: 100%; max-height: 100%; border-radius: 8px; }

  /* ── Feed pane (right top) ────────────────────────────── */
  .feed-controls {
    display: flex; align-items: center; gap: 4px;
  }
  .feed-ctrl-btn {
    padding: 2px 6px; border-radius: 4px;
    font-size: 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-2);
    cursor: pointer; line-height: 1;
  }
  .feed-ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
  .feed-ctrl-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .feed-filter {
    padding: 2px 6px; border-radius: 4px;
    font-size: 10px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-2);
    cursor: pointer; outline: none;
  }
  .feed-filter:focus { border-color: var(--accent); }
  .feed-list {
    flex: 1; overflow-y: auto; padding: 4px 8px;
  }
  .feed-item {
    padding: 8px 10px; border-radius: 6px;
    margin-bottom: 4px;
    background: var(--bg); border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    animation: feed-in 0.25s ease;
  }
  .feed-item[data-kind="agent_thinking"] { border-left-color: var(--accent); }
  .feed-item[data-kind="agent_tool_use"] { border-left-color: #ffb400; }
  .feed-item[data-kind="agent_result"] { border-left-color: #4caf50; }
  .feed-item[data-kind="agent_error"] { border-left-color: #f44; }
  .feed-item[data-kind="status"] { border-left-color: var(--text-3); }
  @keyframes feed-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .feed-item-header {
    display: flex; align-items: center; gap: 6px; margin-bottom: 3px;
  }
  .feed-item-avatar {
    width: 18px; height: 18px; border-radius: 4px; flex-shrink: 0;
    overflow: hidden; background: var(--surface-3);
  }
  .feed-item-avatar img, .feed-item-avatar svg {
    width: 100%; height: 100%; display: block; object-fit: cover;
  }
  .feed-item-name {
    font-size: 11px; font-weight: 600; color: var(--accent);
  }
  .feed-item-kind {
    font-size: 10px; font-family: var(--font-mono);
    margin-left: auto;
    padding: 1px 6px; border-radius: 3px;
  }
  .feed-item-kind.kind-thinking { color: var(--accent); background: rgba(100,200,255,0.08); }
  .feed-item-kind.kind-tool { color: #ffb400; background: rgba(255,180,0,0.08); }
  .feed-item-kind.kind-result { color: #4caf50; background: rgba(76,175,80,0.08); }
  .feed-item-kind.kind-error { color: #f44; background: rgba(244,68,68,0.08); }
  .feed-item-kind.kind-default { color: var(--text-3); }
  .feed-item-time {
    font-size: 9px; color: var(--text-3); font-family: var(--font-mono);
  }
  .feed-item-body {
    font-size: 12px; color: var(--text-2); line-height: 1.4;
    white-space: pre-wrap; word-break: break-word;
    max-height: 50px; overflow: hidden;
    cursor: pointer; transition: max-height 0.2s ease;
  }
  .feed-item.expanded .feed-item-body {
    max-height: none;
  }
  .feed-item-expand {
    font-size: 10px; color: var(--text-3); cursor: pointer;
    margin-top: 2px; user-select: none;
  }
  .feed-item-expand:hover { color: var(--accent); }
  .feed-spinner {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; margin-bottom: 4px;
    font-size: 11px; color: var(--text-3);
    border-radius: 6px;
    background: var(--surface); border: 1px solid var(--border);
  }
  .feed-spinner:empty { display: none; }
  .feed-spinner-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent);
    animation: pulse-anim 1.5s ease-in-out infinite;
  }

  /* ── Feed toolbar (center pane) ────────────────────────── */
  .feed-toolbar {
    display: flex; align-items: center; justify-content: flex-end;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  /* ── Wrapped results view ───────────────────────────────── */
  .wrapped-view {
    flex: 1; overflow-y: auto;
  }
  .wrapped-topbar {
    padding: 8px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .wrapped-back-btn {
    padding: 5px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-2);
    cursor: pointer; transition: all 0.15s;
  }
  .wrapped-back-btn:hover { border-color: var(--accent); color: var(--accent); }
  .wrapped-frame {
    max-width: 880px; margin: 0 auto; padding: 24px;
  }
  .wrapped-banner {
    width: 100%; aspect-ratio: 3/1; border-radius: 12px;
    overflow: hidden; margin-bottom: 20px;
    background-size: cover; background-position: center;
  }
  .wrapped-banner:empty { display: none; }
  .wrapped-head {
    padding: 0 0 16px; border-bottom: 1px solid var(--border);
  }
  .wrapped-head h1 {
    font-family: var(--font-mono);
    font-size: clamp(1.6rem, 3vw, 2.4rem);
    font-weight: 800; letter-spacing: -0.02em;
    margin: 4px 0 8px;
  }
  .wrapped-goal {
    color: var(--text-2); font-size: 14px; line-height: 1.5;
    margin: 0 0 16px;
  }
  .wrapped-meta-row {
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-top: 4px;
  }
  .wrapped-meta-pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 11px; color: var(--text-2);
  }
  .wrapped-meta-pill.status {
    background: rgba(255,180,0,0.1); color: #ffb400;
    border-color: rgba(255,180,0,0.2);
  }
  .wrapped-agents-row {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-top: 16px;
  }
  .wrapped-agent-chip {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--border);
  }
  .wrapped-agent-avatar {
    width: 24px; height: 24px; border-radius: 6px;
    overflow: hidden; background: var(--surface-3); flex-shrink: 0;
  }
  .wrapped-agent-avatar img, .wrapped-agent-avatar svg {
    width: 100%; height: 100%; display: block; object-fit: cover;
  }
  .wrapped-agent-name { font-size: 11px; font-weight: 600; color: var(--text); }
  .wrapped-agent-tokens {
    font-size: 9px; color: var(--text-3); font-family: var(--font-mono);
  }

  /* ── Repo clone section ──────────────────────────────── */
  .wrapped-repo {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 16px; padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .wrapped-repo:empty { display: none; }
  .wrapped-repo-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-3);
  }
  .wrapped-clone-tabs {
    display: flex; gap: 0; border-radius: 6px; overflow: hidden;
    border: 1px solid var(--border);
  }
  .wrapped-clone-tab {
    padding: 4px 10px; font-size: 11px; font-weight: 600;
    border: none; background: var(--surface-2); color: var(--text-3);
    cursor: pointer; transition: all 0.12s;
  }
  .wrapped-clone-tab:not(:last-child) { border-right: 1px solid var(--border); }
  .wrapped-clone-tab.active { background: var(--surface); color: var(--text); }
  .wrapped-clone-tab:hover { color: var(--text-2); }
  .wrapped-clone-url {
    flex: 1; min-width: 200px;
    padding: 4px 10px; border-radius: 6px;
    font-size: 11px; font-family: var(--font-mono);
    border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text);
    outline: none; cursor: text;
  }
  .wrapped-clone-copy {
    padding: 4px 10px; border-radius: 6px;
    font-size: 11px; font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-2);
    cursor: pointer; transition: all 0.12s;
  }
  .wrapped-clone-copy:hover { border-color: var(--accent); color: var(--accent); }

  /* ── GitHub-style file table ──────────────────────────── */
  .wrapped-file-table {
    border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; margin-top: 24px;
  }
  .wrapped-file-row {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px; cursor: pointer;
    transition: background 0.1s;
  }
  .wrapped-file-row:last-child { border-bottom: none; }
  .wrapped-file-row:hover { background: var(--surface-2); }
  .wrapped-file-row.active { background: var(--active-bg, var(--surface-2)); }
  .wrapped-file-icon {
    width: 16px; text-align: center; flex-shrink: 0;
    font-size: 12px; color: var(--text-3);
  }
  .wrapped-file-icon.dir { color: var(--accent); }
  .wrapped-file-name {
    flex: 1; color: var(--text);
    font-family: var(--font-mono); font-size: 13px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .wrapped-file-name.dir { font-weight: 600; }
  .wrapped-file-breadcrumb {
    display: flex; align-items: center; gap: 4px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    font-family: var(--font-mono); font-size: 12px;
    color: var(--text-3);
  }
  .wrapped-file-breadcrumb a {
    color: var(--accent); text-decoration: none; cursor: pointer;
  }
  .wrapped-file-breadcrumb a:hover { text-decoration: underline; }

  /* ── File content viewer (inline) ─────────────────────── */
  .wrapped-file-content {
    border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; margin-top: 16px;
  }
  .wrapped-file-content:empty { display: none; }
  .wrapped-file-content-header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 12px;
    color: var(--text-2);
  }
  .wrapped-file-content-body {
    padding: 16px;
    font-family: var(--font-mono); font-size: 12px; line-height: 1.6;
    color: var(--text); overflow-x: auto;
    background: var(--bg);
    max-height: 600px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-word;
  }
  .wrapped-file-content-body img { max-width: 100%; border-radius: 8px; }

  /* ── README section ───────────────────────────────────── */
  .wrapped-readme {
    border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; margin-top: 16px;
  }
  .wrapped-readme:empty { display: none; }
  .wrapped-readme-header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 13px; font-weight: 600; color: var(--text);
  }
  .wrapped-readme-content {
    padding: 24px 32px;
    line-height: 1.7; font-size: 14px; color: var(--text);
  }
  .wrapped-readme-content h1 { font-size: 22px; font-weight: 800; margin: 0 0 12px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  .wrapped-readme-content h2 { font-size: 17px; font-weight: 700; margin: 20px 0 8px; }
  .wrapped-readme-content h3 { font-size: 14px; font-weight: 700; margin: 16px 0 6px; }
  .wrapped-readme-content p { margin: 8px 0; }
  .wrapped-readme-content ul, .wrapped-readme-content ol { margin: 8px 0; padding-left: 24px; }
  .wrapped-readme-content li { margin: 4px 0; }
  .wrapped-readme-content code {
    font-family: var(--font-mono); font-size: 13px;
    background: var(--surface-2); padding: 1px 5px; border-radius: 3px;
  }
  .wrapped-readme-content pre {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; padding: 14px 16px; overflow-x: auto;
    margin: 12px 0; font-size: 13px; line-height: 1.5;
  }
  .wrapped-readme-content pre code { background: none; padding: 0; }
  .wrapped-readme-content blockquote {
    border-left: 3px solid var(--accent); padding: 4px 16px;
    margin: 8px 0; color: var(--text-2);
    background: var(--surface); border-radius: 0 6px 6px 0;
  }
  .wrapped-readme-content a { color: var(--accent); text-decoration: none; }
  .wrapped-readme-content a:hover { text-decoration: underline; }
  .wrapped-readme-content hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .wrapped-readme-content img { max-width: 100%; border-radius: 8px; margin: 8px 0; }

  /* ── Card detail modal ─────────────────────────────────── */
  .card-modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(4px);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    animation: modal-fade-in 0.15s ease;
  }
  @keyframes modal-fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .card-modal {
    width: 640px; max-width: 90vw;
    max-height: 85vh;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex; flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    animation: modal-slide-in 0.2s ease;
  }
  @keyframes modal-slide-in {
    from { transform: translateY(12px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .card-modal-header {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 20px 20px 12px;
    flex-shrink: 0;
  }
  .card-modal-number {
    font-size: 13px; font-weight: 700; color: var(--text-3);
    font-family: var(--font-mono);
    flex-shrink: 0; padding-top: 2px;
  }
  .card-modal-title {
    font-size: 16px; font-weight: 700; color: var(--text);
    line-height: 1.3; flex: 1; min-width: 0;
    word-break: break-word;
  }
  .card-modal-close {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    border: none; border-radius: 6px;
    background: transparent; color: var(--text-3);
    cursor: pointer; font-size: 18px; line-height: 1;
    flex-shrink: 0; transition: all 0.12s;
  }
  .card-modal-close:hover { background: var(--surface-2); color: var(--text); }
  .card-modal-meta {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 0 20px 14px;
    flex-shrink: 0;
  }
  .card-modal-badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface);
  }
  .card-modal-badge.status-open { color: #4caf50; border-color: rgba(76,175,80,0.3); }
  .card-modal-badge.status-closed { color: #f44; border-color: rgba(244,68,68,0.3); }
  .card-modal-badge.label {
    font-size: 10px; padding: 2px 8px;
  }
  .card-modal-assignee {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--text-2);
  }
  .card-modal-assignee-avatar {
    width: 16px; height: 16px; border-radius: 4px;
    background: var(--surface-3); overflow: hidden;
  }
  .card-modal-assignee-avatar img {
    width: 100%; height: 100%; display: block; object-fit: cover;
  }
  .card-modal-date {
    font-size: 11px; color: var(--text-3); font-family: var(--font-mono);
    margin-left: auto;
  }
  .card-modal-body {
    padding: 0 20px 14px;
    font-size: 13px; color: var(--text-2); line-height: 1.6;
    white-space: pre-wrap; word-break: break-word;
    max-height: 200px; overflow-y: auto;
    flex-shrink: 0;
  }
  .card-modal-body:empty { display: none; }
  .card-modal-body code {
    font-family: var(--font-mono); font-size: 12px;
    background: var(--surface-2); padding: 1px 4px; border-radius: 3px;
  }
  .card-modal-body pre {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 10px 12px; overflow-x: auto;
    font-size: 12px; line-height: 1.5;
  }
  .card-modal-body pre code { background: none; padding: 0; }
  .card-modal-divider {
    height: 1px; background: var(--border); margin: 0 20px;
    flex-shrink: 0;
  }
  .card-modal-comments-header {
    padding: 12px 20px 8px;
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-3);
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0;
  }
  .card-modal-comments-header .count {
    background: var(--surface-3); border-radius: 8px;
    padding: 1px 6px; font-size: 10px; color: var(--text-2);
  }
  .card-modal-comments {
    flex: 1; overflow-y: auto;
    padding: 0 20px 16px;
    display: flex; flex-direction: column; gap: 10px;
    min-height: 0;
  }
  .card-modal-comment {
    display: flex; gap: 10px; align-items: flex-start;
  }
  .card-modal-comment-avatar {
    width: 28px; height: 28px; border-radius: 6px;
    background: var(--surface-3); overflow: hidden;
    flex-shrink: 0;
  }
  .card-modal-comment-avatar img {
    width: 100%; height: 100%; display: block; object-fit: cover;
  }
  .card-modal-comment-content { flex: 1; min-width: 0; }
  .card-modal-comment-header {
    display: flex; align-items: center; gap: 6px; margin-bottom: 3px;
  }
  .card-modal-comment-user {
    font-size: 12px; font-weight: 600; color: var(--text);
  }
  .card-modal-comment-time {
    font-size: 10px; color: var(--text-3); font-family: var(--font-mono);
  }
  .card-modal-comment-body {
    font-size: 12px; color: var(--text-2); line-height: 1.5;
    white-space: pre-wrap; word-break: break-word;
  }
  .card-modal-comment-body code {
    font-family: var(--font-mono); font-size: 11px;
    background: var(--surface-2); padding: 1px 4px; border-radius: 3px;
  }
  .card-modal-no-comments {
    font-size: 12px; color: var(--text-3); text-align: center;
    padding: 20px 0;
  }
  .card-modal-loading {
    font-size: 12px; color: var(--text-3); text-align: center;
    padding: 40px 0;
  }
  .card-modal-link {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--accent); text-decoration: none;
    padding: 3px 10px; border-radius: 999px;
    border: 1px solid rgba(var(--accent-rgb, 100,200,255), 0.3);
  }
  .card-modal-link:hover { text-decoration: underline; }

  /* ── Cypher 3D viz container ────────────────────────────── */
  #cypher-viz-container {
    flex: 1; position: relative; overflow: hidden;
    background: #000;
  }
  #cypher-viz-container canvas {
    display: block; width: 100%; height: 100%;
  }

  /* ── Viz overlay: labels ───────────────────────────────── */
  .cviz-label {
    position: absolute;
    font-size: 13px; font-weight: 700;
    color: rgba(180, 200, 230, 0.7);
    font-family: var(--font-mono);
    text-align: center;
    white-space: nowrap;
    pointer-events: none;
    transform: translateX(-50%);
    letter-spacing: 0.04em;
    text-shadow: 0 0 10px rgba(0,0,0,0.9), 0 0 3px rgba(0,0,0,0.7);
  }

  /* ── Viz overlay: dialogs ──────────────────────────────── */
  .cviz-dialog {
    position: absolute;
    background: rgba(8, 12, 22, 0.92);
    border: 1px solid rgba(100, 200, 255, 0.15);
    border-radius: 8px;
    padding: 8px 12px;
    max-width: 240px;
    font-size: 11px;
    color: #99aabb;
    transform: scale(0);
    opacity: 0;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
    pointer-events: none;
    transform-origin: bottom center;
    z-index: 10;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 15px rgba(60,120,200,0.08);
  }
  .cviz-dlg-header {
    display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
  }
  .cviz-dlg-name {
    font-size: 10px; font-weight: 700;
    color: var(--accent, #4af);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .cviz-dlg-kind {
    font-size: 9px; font-family: var(--font-mono);
    padding: 1px 5px; border-radius: 3px;
    margin-left: auto;
  }
  .cviz-dlg-kind.kthink { color: var(--accent, #4af); background: rgba(100,200,255,0.1); }
  .cviz-dlg-kind.ktool { color: #ffb400; background: rgba(255,180,0,0.1); }
  .cviz-dlg-kind.kresult { color: #4caf50; background: rgba(76,175,80,0.1); }
  .cviz-dlg-kind.kerror { color: #f44; background: rgba(244,68,68,0.1); }
  .cviz-dlg-body {
    color: #7788aa;
    line-height: 1.4;
    word-break: break-word;
    max-height: 80px;
    overflow: hidden;
  }

  /* ── Utilities ─────────────────────────────────────────── */
  .hidden { display: none !important; }

  /* Prevent text selection during drag */
  body.dragging { user-select: none; cursor: col-resize; }
  body.dragging-h { user-select: none; cursor: row-resize; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <span class="brand"><span class="dot">.</span>cypher</span>
  <span class="topbar-title" id="cypher-title">&mdash;</span>
  <span class="topbar-status lobby" id="cypher-status">
    <span class="pulse"></span>
    <span id="cypher-status-text">lobby</span>
  </span>
  <span class="topbar-tokens" id="cypher-tokens" title="Total tokens (in / out)"></span>
  <span class="topbar-spacer"></span>
  <button class="topbar-btn danger" id="btn-close-cypher" title="Wrap cypher and show results">Close Cypher</button>
  <button class="topbar-btn" id="btn-leave" title="Leave cypher">Leave</button>
</div>

<!-- 3-column workspace -->
<div class="workspace" id="workspace">

  <!-- Left column: files + jammers -->
  <div class="col col-left" id="col-left">
    <div class="pane pane-top" id="pane-files">
      <div class="pane-header">Files</div>
      <input type="text" class="pane-search" id="file-search" placeholder="Search files..." />
      <div class="file-tree" id="file-tree"></div>
    </div>
    <div class="hsplit" id="hsplit-left"></div>
    <div class="pane pane-bottom" id="pane-jammers">
      <div class="pane-header">
        Jammers <span class="count" id="jammer-count">0</span>
      </div>
      <input type="text" class="jammer-search" id="jammer-search" placeholder="Search jammers..." />
      <div class="jammer-list" id="jammer-list"></div>
      <div class="jammer-page-controls hidden" id="jammer-page-controls">
        <button class="jammer-page-btn" id="jammer-prev" disabled>&laquo;</button>
        <span class="jammer-page-info" id="jammer-page-info">1 / 1</span>
        <button class="jammer-page-btn" id="jammer-next" disabled>&raquo;</button>
      </div>
    </div>
  </div>

  <div class="vsplit" id="vsplit-left"></div>

  <!-- Center column: Feed + Board + Files tabs -->
  <div class="col col-center" id="col-center">
    <div class="center-tabs">
      <button class="center-tab active" data-ctab="cypher">Cypher</button>
      <button class="center-tab" data-ctab="board">Board</button>
      <button class="center-tab" data-ctab="files">Files</button>
    </div>

    <!-- Cypher 3D visualization (default) -->
    <div class="center-pane" id="center-cypher">
      <div id="cypher-viz-container"></div>
    </div>

    <!-- Board view -->
    <div class="center-pane hidden" id="center-board">
      <div class="board-view" id="board-view">
        <div class="board-column">
          <div class="board-col-header">Backlog <span class="count" id="board-count-backlog">0</span></div>
          <div class="board-cards" id="board-backlog"></div>
        </div>
        <div class="board-column">
          <div class="board-col-header col-active">In Progress <span class="count" id="board-count-active">0</span></div>
          <div class="board-cards" id="board-active"></div>
        </div>
        <div class="board-column">
          <div class="board-col-header col-review">Review <span class="count" id="board-count-review">0</span></div>
          <div class="board-cards" id="board-review"></div>
        </div>
        <div class="board-column">
          <div class="board-col-header col-done">Done <span class="count" id="board-count-done">0</span></div>
          <div class="board-cards" id="board-done"></div>
        </div>
      </div>
    </div>

    <!-- Files view -->
    <div class="center-pane hidden" id="center-files">
      <div class="viewer-tabs" id="viewer-tabs"></div>
      <div class="viewer-empty" id="viewer-empty">Select a file to view</div>
      <div id="monaco-container"></div>
      <div id="media-viewer"></div>
    </div>
  </div>

  <div class="vsplit" id="vsplit-right"></div>

  <!-- Right column: feed -->
  <div class="col col-right" id="col-right">
    <div class="pane-header">Feed</div>
    <div class="feed-toolbar">
      <div class="feed-controls">
        <button class="feed-ctrl-btn" id="feed-pause" title="Pause feed">&#9646;&#9646;</button>
        <select class="feed-filter" id="feed-filter">
          <option value="all">All</option>
          <option value="status">Status</option>
          <option value="broadcast">Broadcast</option>
          <option value="board">Board</option>
        </select>
      </div>
    </div>
    <div class="feed-spinner" id="feed-spinner"></div>
    <div class="feed-list" id="feed-list">
      <div class="feed-empty" id="feed-empty">No activity yet</div>
    </div>
  </div>

</div>

<!-- Card detail modal -->
<div class="card-modal-overlay hidden" id="card-modal-overlay">
  <div class="card-modal" id="card-modal">
    <div class="card-modal-header">
      <div class="card-modal-number" id="card-modal-number"></div>
      <div class="card-modal-title" id="card-modal-title"></div>
      <button class="card-modal-close" id="card-modal-close">&times;</button>
    </div>
    <div class="card-modal-meta" id="card-modal-meta"></div>
    <div class="card-modal-body" id="card-modal-body"></div>
    <div class="card-modal-divider"></div>
    <div class="card-modal-comments-header">
      Comments <span class="count" id="card-modal-comment-count">0</span>
    </div>
    <div class="card-modal-comments" id="card-modal-comments"></div>
    <div class="card-modal-loading hidden" id="card-modal-loading">Loading...</div>
  </div>
</div>

<!-- Wrapped results (shown after cypher closes) -->
<div class="wrapped-view hidden" id="wrapped-view">
  <div class="wrapped-frame">
    <div style="margin-bottom:12px;">
      <button class="wrapped-back-btn" id="wrapped-back-btn">&larr; Back</button>
    </div>
    <div class="wrapped-banner" id="wrapped-banner"></div>
    <div class="wrapped-head">
        <h1 id="wrapped-title"></h1>
        <p class="wrapped-goal" id="wrapped-goal"></p>
        <div class="wrapped-meta-row" id="wrapped-meta-row"></div>
        <div class="wrapped-agents-row" id="wrapped-agents-row"></div>
        <div class="wrapped-repo" id="wrapped-repo"></div>
      </div>
      <div class="wrapped-file-table" id="wrapped-file-table"></div>
      <div class="wrapped-file-content" id="wrapped-file-content"></div>
      <div class="wrapped-readme" id="wrapped-readme"></div>
    </div>
</div>

<script src="monaco/loader.js"></script>
<script src="cypher.js"></script>
</body>
</html>
