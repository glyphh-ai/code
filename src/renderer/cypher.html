<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cypher</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { font-size: 14px; line-height: 1.5; overflow: hidden; }

  /* ── Top bar ───────────────────────────────────────────── */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .brand {
    font-family: var(--font-mono); font-size: 16px; font-weight: 800;
    color: var(--text); letter-spacing: -0.02em;
  }
  .brand .dot { color: var(--accent); }
  .topbar-title {
    font-size: 13px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 300px;
  }
  .topbar-status {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .topbar-status.live {
    background: var(--accent-glow); color: var(--accent);
  }
  .topbar-status.lobby {
    background: rgba(255,180,0,0.1); color: #ffb400;
  }
  .topbar-status .pulse {
    width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; animation: pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }
  .topbar-spacer { flex: 1; }
  .topbar-btn {
    padding: 5px 12px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
    border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-2);
    cursor: pointer; transition: all 0.15s ease;
  }
  .topbar-btn:hover { border-color: var(--accent); color: var(--accent); }
  .topbar-btn.danger:hover { border-color: #f44; color: #f44; }

  /* ── Main layout ─────────────────────────────────────────── */
  .cypher-layout {
    display: flex;
    height: calc(100vh - 49px);
    overflow: hidden;
  }

  /* ── Left: Roster ──────────────────────────────────────── */
  .roster-panel {
    width: 220px; min-width: 180px;
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .roster-header {
    padding: 14px 16px 10px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-2);
    border-bottom: 1px solid var(--border);
  }
  .roster-list {
    flex: 1; overflow-y: auto; padding: 8px;
  }
  .roster-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px;
    cursor: default; transition: background 0.12s ease;
  }
  .roster-item:hover { background: var(--surface-2); }
  .roster-item.active { background: var(--accent-glow); }
  .roster-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--surface-3); display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; color: var(--text-2);
    flex-shrink: 0;
  }
  .roster-info { flex: 1; min-width: 0; }
  .roster-name {
    font-size: 12px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .roster-role {
    font-size: 10px; color: var(--text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .roster-status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    flex-shrink: 0;
  }
  .roster-status-dot.idle { background: var(--text-3); }
  .roster-status-dot.running { background: #ffb400; animation: pulse-dot 1.2s ease-in-out infinite; }
  .roster-status-dot.waiting { background: #4caf50; box-shadow: 0 0 6px #4caf5088; }
  .roster-status-dot.starting { background: #ffb400; animation: pulse-dot 1.2s ease-in-out infinite; }
  .roster-status-dot.error { background: #f44; }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── Center: Stage (agent output) ──────────────────────── */
  .stage-panel {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .stage-header {
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    background: var(--surface);
  }
  .stage-agent-name {
    font-size: 13px; font-weight: 700; color: var(--text);
  }
  .stage-agent-status {
    font-size: 11px; color: var(--text-3); font-weight: 500;
  }
  .stage-stream {
    flex: 1; overflow-y: auto; padding: 20px;
  }
  .stage-msg {
    margin-bottom: 16px; padding: 12px 16px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; font-size: 13px; color: var(--text);
    line-height: 1.6;
  }
  .stage-msg.tool-use {
    border-left: 3px solid var(--accent);
    font-family: var(--font-mono); font-size: 12px;
    color: var(--text-2);
  }
  .stage-msg.error {
    border-left: 3px solid #f44;
    color: #f88;
  }
  .stage-msg.tool-result {
    border-left: 3px solid var(--text-3);
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-3); max-height: 120px; overflow-y: auto;
  }
  .stage-msg .msg-meta {
    font-size: 10px; color: var(--text-3); margin-bottom: 4px;
    display: flex; gap: 8px; align-items: center;
  }
  .stage-empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: var(--text-3); font-size: 14px;
  }

  /* Owner input bar at bottom of stage */
  .stage-input-bar {
    display: flex; gap: 8px; padding: 12px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  .stage-input-bar input {
    flex: 1;
    background: var(--surface-2); border: 1px solid var(--border-2);
    border-radius: 8px; padding: 8px 14px;
    font-size: 13px; color: var(--text); outline: none;
  }
  .stage-input-bar input:focus { border-color: var(--accent); }
  .stage-input-bar button {
    padding: 8px 16px; border-radius: 8px;
    background: var(--accent); color: #000;
    font-size: 12px; font-weight: 700; border: none;
    cursor: pointer; transition: opacity 0.15s;
  }
  .stage-input-bar button:hover { opacity: 0.85; }

  /* ── Right: Chat / Drips ───────────────────────────────── */
  .chat-panel {
    width: 300px; min-width: 240px;
    border-left: 1px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .chat-header {
    padding: 14px 16px 10px;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em; color: var(--text-2);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 12px;
  }
  .chat-msg {
    margin-bottom: 10px;
  }
  .chat-msg-author {
    font-size: 11px; font-weight: 700; color: var(--accent);
    margin-bottom: 2px;
  }
  .chat-msg-body {
    font-size: 13px; color: var(--text); line-height: 1.5;
    word-wrap: break-word;
  }
  .chat-msg-time {
    font-size: 10px; color: var(--text-3); margin-top: 2px;
  }
  .chat-msg.system .chat-msg-author { color: var(--text-3); }
  .chat-msg.system .chat-msg-body { color: var(--text-2); font-style: italic; }

  .chat-input-bar {
    display: flex; gap: 8px; padding: 12px;
    border-top: 1px solid var(--border);
  }
  .chat-input-bar input {
    flex: 1;
    background: var(--surface-2); border: 1px solid var(--border-2);
    border-radius: 8px; padding: 8px 12px;
    font-size: 13px; color: var(--text); outline: none;
  }
  .chat-input-bar input:focus { border-color: var(--accent); }
  .chat-input-bar button {
    padding: 8px 12px; border-radius: 6px;
    background: var(--accent); color: #000;
    font-size: 12px; font-weight: 700; border: none;
    cursor: pointer;
  }

  /* ── Utilities ─────────────────────────────────────────── */
  .hidden { display: none !important; }

  /* Markdown rendered content */
  .stage-msg :is(pre, code) { font-family: var(--font-mono); font-size: 12px; }
  .stage-msg pre {
    background: var(--surface-2); border-radius: 6px;
    padding: 10px 14px; overflow-x: auto; margin: 8px 0;
  }
  .stage-msg code { background: var(--surface-2); padding: 1px 5px; border-radius: 3px; }
  .stage-msg pre code { background: none; padding: 0; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="topbar">
  <span class="brand"><span class="dot">.</span>cypher</span>
  <span class="topbar-title" id="cypher-title">—</span>
  <span class="topbar-status lobby" id="cypher-status">
    <span class="pulse"></span>
    <span id="cypher-status-text">lobby</span>
  </span>
  <span class="topbar-spacer"></span>
  <button class="topbar-btn" id="btn-spawn" title="Start agents">Spawn</button>
  <button class="topbar-btn danger" id="btn-leave" title="Leave cypher">Leave</button>
</div>

<!-- Main 3-column layout -->
<div class="cypher-layout">

  <!-- Left: Roster -->
  <div class="roster-panel">
    <div class="roster-header">Jammers</div>
    <div class="roster-list" id="roster-list"></div>
  </div>

  <!-- Center: Agent output stage -->
  <div class="stage-panel">
    <div class="stage-header">
      <span class="stage-agent-name" id="stage-agent-name">—</span>
      <span class="stage-agent-status" id="stage-agent-status"></span>
    </div>
    <div class="stage-stream" id="stage-stream">
      <div class="stage-empty" id="stage-empty">Waiting for agents to start...</div>
    </div>
  </div>

  <!-- Right: Chat / Drips -->
  <div class="chat-panel">
    <div class="chat-header">
      <span>Chat</span>
      <span id="chat-count" style="font-weight:400; color:var(--text-3);">0</span>
    </div>
    <div class="chat-messages" id="chat-messages"></div>
    <div class="chat-input-bar">
      <input type="text" id="chat-input" placeholder="Say something..." />
      <button id="btn-send-chat">Send</button>
    </div>
  </div>

</div>

<script src="cypher.js"></script>
</body>
</html>
