<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <script>
    const theme = localStorage.getItem("yoTheme") || "system";
    const resolved = theme === "system"
      ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
      : theme;
    document.documentElement.setAttribute("data-theme", resolved);
  </script>
  <style>
    @font-face {
      font-family: 'Inter';
      src: url('fonts/Inter-VariableFont_opsz,wght.ttf') format('truetype');
      font-weight: 100 900;
    }
    @font-face {
      font-family: 'JetBrains Mono';
      src: url('fonts/JetBrainsMono-VariableFont_wght.ttf') format('truetype');
      font-weight: 100 800;
    }

    :root, [data-theme="light"] {
      color-scheme: light;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', 'Courier New', monospace;
      --bg: #f5f5f5; --bg-raised: #ffffff;
      --surface: #ffffff; --surface-2: #fafafa; --surface-3: #f0f0f0;
      --border: #e5e5e5; --border-2: #d4d4d4; --border-3: #c4c4c4;
      --text: #1f2937; --text-bright: #111111; --text-2: #4b5563; --text-3: #6b7280;
      --text-muted: #6b7280; --text-faint: #9ca3af;
      --hover: #f0f0f0; --active-bg: rgba(37,199,94,0.06);
      --accent: #25C75E; --accent-hover: #22b855; --accent-dark: #1a9e48; --accent-bg: #ecfdf5;
      --danger: #ef4444; --danger-soft: #f87171; --danger-bg: #fef2f2;
      --warning: #f59e0b; --success: #16a34a; --blue: #3b82f6; --purple: #a855f7;
      --overlay-bg: rgba(0,0,0,0.3); --shadow: rgba(0,0,0,0.12);
      --scrollbar: #d4d4d4; --scrollbar-hover: #25C75E;
      --code-inline: #9333ea; --input-bg: var(--surface-2); --card-bg: var(--surface);
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a0a0a; --bg-raised: #0d0d0d;
      --surface: #111111; --surface-2: #1a1a1a; --surface-3: #141414;
      --border: #1e1e1e; --border-2: #2a2a2a; --border-3: #333333;
      --text: #e8e8e8; --text-bright: #ffffff; --text-2: #a0a0a0; --text-3: #707070;
      --text-muted: #606060; --text-faint: #484848;
      --hover: #1e1e1e; --active-bg: rgba(37,199,94,0.08);
      --accent: #25C75E; --accent-hover: #2dd868; --accent-dark: #1da34d; --accent-bg: #1a2a1e;
      --danger: #ff5f57; --danger-soft: #ff6b6b; --danger-bg: #2a1515;
      --warning: #f0a030; --success: #28c840; --blue: #4A9EFF; --purple: #a855f7;
      --overlay-bg: rgba(0,0,0,0.6); --shadow: rgba(0,0,0,0.4);
      --scrollbar: #333; --scrollbar-hover: #555;
      --code-inline: #e0a0ff; --input-bg: var(--surface); --card-bg: var(--surface-3);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: var(--bg); color: var(--text);
      font-family: var(--font-sans); font-size: 13px;
      display: flex; flex-direction: column;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scrollbar); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

    /* ── Meet-style layout ── */
    #cypher-layout {
      display: flex; width: 100%; flex: 1; min-height: 0;
    }

    /* Main stage — left side */
    #main-stage {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      border-right: 1px solid var(--border);
    }
    #stage-header {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 14px; height: 40px; flex-shrink: 0;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    #stage-agent-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-faint); flex-shrink: 0;
    }
    #stage-agent-dot.running { background: var(--accent); animation: dot-pulse 1.2s ease-in-out infinite; }
    #stage-agent-name {
      font-size: 13px; font-weight: 600; color: var(--text-bright);
    }
    #stage-agent-role {
      font-size: 11px; color: var(--text-3); margin-left: 4px;
    }
    #stage-sharing-badge {
      margin-left: auto; font-size: 10px; color: var(--accent);
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
      display: none;
    }
    #stage-content {
      flex: 1; overflow-y: auto; padding: 14px 18px; min-height: 0;
    }
    #stage-empty {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: var(--text-3); font-size: 14px;
      flex-direction: column; gap: 8px;
    }
    #stage-empty-icon { font-size: 32px; opacity: 0.4; }

    /* Input area */
    #stage-input-wrap {
      display: flex; align-items: flex-end; gap: 8px;
      padding: 10px 14px; border-top: 1px solid var(--border-2);
      flex-shrink: 0; background: var(--surface);
    }
    #stage-input {
      flex: 1; background: var(--surface-3);
      border: 1px solid var(--border-3); border-radius: 10px;
      padding: 8px 12px; color: var(--text);
      font-size: 13px; font-family: var(--font-sans);
      resize: none; outline: none; max-height: 120px;
      min-height: 36px; height: 36px; line-height: 1.5;
      overflow-y: auto;
    }
    #stage-input:focus { border-color: var(--accent); }
    #stage-input::placeholder { color: var(--text-muted); }
    #stage-send {
      background: var(--accent); color: #000; border: none;
      width: 30px; height: 30px; border-radius: 8px;
      font-size: 16px; font-weight: 700; cursor: pointer;
      flex-shrink: 0; margin-bottom: 3px;
      display: flex; align-items: center; justify-content: center;
    }
    #stage-send:hover { opacity: 0.8; }
    #stage-stop {
      background: none; border: 1px solid var(--danger); color: var(--danger);
      font-size: 11px; padding: 4px 10px; border-radius: 6px;
      cursor: pointer; flex-shrink: 0; margin-bottom: 3px;
      display: none;
    }
    #stage-stop:hover { background: var(--danger-bg); }
    #stage-stop.visible { display: block; }

    /* ── Participants sidebar — right side ── */
    #participants {
      width: 240px; flex-shrink: 0; display: flex; flex-direction: column;
      background: var(--surface);
    }
    #participants-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-bottom: 1px solid var(--border);
      height: 40px; flex-shrink: 0;
    }
    #participants-title {
      font-size: 11px; font-weight: 600; color: var(--text-2);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    #participants-count {
      font-size: 11px; color: var(--text-3); font-family: var(--font-mono);
    }
    #participants-list {
      flex: 1; overflow-y: auto; padding: 6px;
    }

    /* Participant tile */
    .participant {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px; border-radius: 8px; cursor: pointer;
      transition: background 0.12s;
      margin-bottom: 2px;
    }
    .participant:hover { background: var(--hover); }
    .participant.active { background: var(--active-bg); border: 1px solid rgba(37,199,94,0.2); }
    .participant.active { margin-bottom: 1px; }
    .p-avatar {
      position: relative; flex-shrink: 0;
      width: 32px; height: 32px; display: inline-block;
    }
    .p-avatar svg { display: block; border-radius: 6px; }
    .p-dot {
      position: absolute; right: -2px; bottom: -2px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--text-faint);
      border: 2px solid var(--surface, #fff);
    }
    .p-dot.running { background: var(--accent); animation: dot-pulse 1.2s ease-in-out infinite; }
    .p-dot.done { background: var(--success); }
    .p-dot.error { background: var(--danger); }
    .p-info { flex: 1; min-width: 0; }
    .p-name {
      font-size: 12px; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .p-role {
      font-size: 10px; color: var(--text-3);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .p-badge {
      font-size: 9px; padding: 1px 5px; border-radius: 3px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
      flex-shrink: 0;
    }
    .p-badge.local { background: var(--surface-3); color: var(--text-3); }
    .p-badge.remote { background: var(--accent-bg); color: var(--accent); }

    /* Add agent button at bottom of sidebar */
    #add-agent-btn {
      margin: 8px 10px; padding: 8px; border: 1px dashed var(--border-2);
      border-radius: 8px; background: none; color: var(--text-3);
      font-size: 12px; cursor: pointer; transition: all 0.15s;
      text-align: center;
    }
    #add-agent-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Cypher info bar (top) ── */
    #cypher-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 0 14px; height: 32px; flex-shrink: 0;
      background: var(--surface-2); border-bottom: 1px solid var(--border);
      font-size: 11px;
    }
    #cypher-bar-dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint);
    }
    #cypher-bar-dot.live { background: var(--accent); animation: dot-pulse 1.2s ease-in-out infinite; }
    #cypher-bar-title { color: var(--text-2); font-weight: 500; }
    #cypher-bar-stats {
      margin-left: auto; color: var(--text-3); font-family: var(--font-mono);
      display: flex; gap: 12px;
    }

    @keyframes dot-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(37,199,94,0.55); }
      70%  { box-shadow: 0 0 0 5px rgba(37,199,94,0); }
      100% { box-shadow: 0 0 0 0 rgba(37,199,94,0); }
    }

    /* ── Messages / content rendering ── */
    .msg-user {
      background: var(--accent-bg); border: 1px solid rgba(37,199,94,0.2);
      border-radius: 10px; padding: 8px 12px; margin: 8px 0;
      font-size: 13px; white-space: pre-wrap; max-width: 85%;
      align-self: flex-end;
    }
    .msg-text { margin: 8px 0; line-height: 1.6; }
    .msg-error {
      color: var(--danger); background: var(--danger-bg); border-radius: 6px;
      padding: 8px 12px; margin: 6px 0; font-size: 12px;
    }

    /* Tool timeline */
    .tool-timeline {
      position: relative; padding-left: 14px; margin: 8px 0;
      border-left: 1px solid var(--border);
    }
    .tool-block { margin: 4px 0; }
    .tool-header {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--text-3); padding: 2px 0;
    }
    .tool-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-faint); margin-left: -18px; flex-shrink: 0;
    }
    .tool-block.active .tool-dot { background: var(--accent); animation: dot-pulse 1.2s ease-in-out infinite; }
    .tool-name { font-weight: 600; color: var(--text-2); font-family: var(--font-mono); }
    .tool-subtitle {
      color: var(--text-faint); font-size: 10px; font-family: var(--font-mono);
      max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* Streaming cursor */
    .streaming-cursor {
      display: inline-block; width: 2px; height: 1em;
      background: var(--accent); animation: cursor-blink 1s step-end infinite;
      vertical-align: text-bottom; margin-left: 1px;
    }
    @keyframes cursor-blink { 50% { opacity: 0; } }

    /* Spinner */
    .stage-spinner {
      display: flex; align-items: center; gap: 10px; padding: 8px 0;
    }
    .stage-spinner-char {
      font-size: 18px; color: var(--accent); width: 20px; text-align: center;
      font-family: var(--font-mono);
    }
    .stage-spinner-phrase { font-size: 13px; color: var(--text-2); }

    /* Markdown */
    .yo-md-p { margin: 6px 0; }
    .yo-md-h1, .yo-md-h2, .yo-md-h3, .yo-md-h4 { font-weight: 700; color: var(--text-bright); margin: 10px 0 4px; }
    .yo-md-h1 { font-size: 16px; } .yo-md-h2 { font-size: 14px; }
    .yo-md-h3 { font-size: 13px; } .yo-md-h4 { font-size: 12px; }
    .yo-md-inline {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 3px; padding: 1px 5px; font-size: 12px;
      font-family: var(--font-mono); color: var(--code-inline);
    }
    .yo-md-codeblock {
      position: relative; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 6px;
      padding: 10px 12px; margin: 6px 0; overflow-x: auto;
      font-family: var(--font-mono); font-size: 12px; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word; color: var(--text);
    }
    .yo-md-codeblock-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;
    }
    .yo-md-codeblock-lang { font-size: 10px; color: var(--text-faint); text-transform: uppercase; }
    .yo-md-copy {
      background: none; border: 1px solid var(--border); border-radius: 4px;
      color: var(--text-3); font-size: 10px; padding: 2px 8px; cursor: pointer;
    }
    .yo-md-copy:hover { border-color: var(--accent); color: var(--accent); }
    .yo-md-link { color: var(--accent); text-decoration: none; }
    .yo-md-link:hover { text-decoration: underline; }
    .yo-md-quote { border-left: 3px solid var(--border-2); padding-left: 10px; color: var(--text-2); margin: 6px 0; }
    .yo-md-list { margin: 4px 0 4px 20px; }
    .yo-md-li { margin: 2px 0; }

    /* ── Add agent modal ── */
    #add-agent-modal {
      display: none; position: fixed; inset: 0;
      background: var(--overlay-bg); z-index: 999;
      align-items: center; justify-content: center;
    }
    #add-agent-modal.visible { display: flex; }
    .modal-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 20px; width: 340px;
      box-shadow: 0 8px 30px var(--shadow);
    }
    .modal-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 14px; color: var(--text-bright); }
    .modal-card input, .modal-card textarea {
      width: 100%; background: var(--input-bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 8px 10px; color: var(--text);
      font-family: var(--font-mono); font-size: 12px; margin-bottom: 8px;
      outline: none; resize: vertical;
    }
    .modal-card input:focus, .modal-card textarea:focus { border-color: var(--accent); }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    .modal-btn-cancel, .modal-btn-add {
      border: none; border-radius: 6px; padding: 6px 16px;
      font-size: 12px; font-weight: 500; cursor: pointer;
    }
    .modal-btn-cancel { background: var(--surface-2); color: var(--text-2); }
    .modal-btn-add { background: var(--accent); color: #fff; }
    .modal-btn-add:hover { background: var(--accent-hover); }
  </style>
</head>
<body>
  <!-- Cypher info bar -->
  <div id="cypher-bar">
    <span id="cypher-bar-dot"></span>
    <span id="cypher-bar-title">Cypher</span>
    <span id="cypher-bar-stats">
      <span id="cypher-bar-kitty"></span>
      <span id="cypher-bar-jammers"></span>
    </span>
  </div>

  <!-- Main layout -->
  <div id="cypher-layout">
    <!-- Main stage -->
    <div id="main-stage">
      <div id="stage-header">
        <span id="stage-agent-dot"></span>
        <span id="stage-agent-name">No agent selected</span>
        <span id="stage-agent-role"></span>
        <span id="stage-sharing-badge">presenting</span>
      </div>
      <div id="stage-content">
        <div id="stage-empty">
          <div id="stage-empty-icon">&#9671;</div>
          <div>Select an agent to view their work</div>
        </div>
      </div>
      <div id="stage-input-wrap">
        <textarea id="stage-input" rows="1" placeholder="Message agent..."></textarea>
        <button id="stage-stop">Stop</button>
        <button id="stage-send">&#8593;</button>
      </div>
    </div>

    <!-- Participants sidebar -->
    <div id="participants">
      <div id="participants-header">
        <span id="participants-title">Participants</span>
        <span id="participants-count">0</span>
      </div>
      <div id="participants-list"></div>
      <button id="add-agent-btn">+ Add Agent</button>
    </div>
  </div>

  <!-- Add agent modal -->
  <div id="add-agent-modal">
    <div class="modal-card">
      <h3>Add Agent</h3>
      <input id="modal-agent-name" type="text" placeholder="Agent name (e.g. ui)" spellcheck="false" autocomplete="off" />
      <input id="modal-agent-role" type="text" placeholder="Role (e.g. frontend engineer)" spellcheck="false" autocomplete="off" />
      <textarea id="modal-agent-prompt" placeholder="System prompt (optional)" rows="3"></textarea>
      <div class="modal-actions">
        <button class="modal-btn-cancel" id="modal-cancel">Cancel</button>
        <button class="modal-btn-add" id="modal-add">Add</button>
      </div>
    </div>
  </div>

  <script src="code-workspace-bundle.js"></script>
</body>
</html>
