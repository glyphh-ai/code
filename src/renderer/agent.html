<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agent</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: 100%; }
  body { font-family: var(--font); font-size: 14px; background: var(--bg); color: var(--text); overflow: hidden; }
  #agent-host { width: 100%; height: 100%; }
  .agent-error {
    padding: 32px;
    color: var(--text-2);
    font-size: 13px;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div id="agent-host"></div>

  <script>
    (async () => {
      const api = window.agent;
      if (api && api.getTheme) {
        const t = await api.getTheme();
        const resolved = t === "system"
          ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : t;
        document.documentElement.setAttribute("data-theme", resolved);
      }
      if (api && api.onThemeChanged) {
        api.onThemeChanged((theme) => {
          document.documentElement.setAttribute("data-theme", theme);
        });
      }
    })();
  </script>
  <script src="./agent.js"></script>
</body>
</html>
