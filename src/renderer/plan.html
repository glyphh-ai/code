<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>.Yo Plan</title>
<link rel="stylesheet" href="styles.css">
<script src="monaco/loader.js"></script>
<script>
  try {
    var t = localStorage.getItem("yoTheme") || "light";
    var r = t === "system"
      ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
      : t;
    document.documentElement.setAttribute("data-theme", r);
  } catch (e) {}
</script>
<style>
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans);
    font-size: 14px;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    margin: 0;
  }

  .wb-shell { display: flex; flex-direction: column; height: 100%; }
  .wb-header {
    height: 40px;
    padding: 0 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    flex-shrink: 0;
  }
  .wb-header-title {
    display: inline-flex;
    align-items: baseline;
    gap: 1px;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    letter-spacing: -0.02em;
    user-select: none;
  }
  .wb-header-title .dot { color: var(--accent); }
  .wb-header-spacer { flex: 1; }

  /* Phase toggles — only ONE is active at a time (clicking switches the
     loaded .md), matching the user's "each step replaces the .md" model. */
  .wb-section-toggles {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .wb-section-btn {
    background: transparent;
    border: 1px solid transparent;
    width: 28px; height: 28px;
    border-radius: 6px;
    color: var(--text-faint);
    cursor: pointer;
    padding: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.10s, color 0.10s, border-color 0.10s;
  }
  .wb-section-btn:hover { background: var(--surface-3); color: var(--text); }
  .wb-section-btn.active {
    background: var(--accent-bg);
    color: var(--accent);
    border-color: var(--accent);
  }
  .wb-section-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* Workdir controls re-scoped under .wb-header (same as workbench). */
  .wb-header .yo-workdir-btn,
  .wb-header .yo-workdir-add,
  .wb-header .yo-workdir-branch {
    flex-shrink: 0;
    white-space: nowrap;
  }
  .wb-header .yo-workdir-btn span,
  .wb-header .yo-workdir-branch span {
    max-width: 160px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .wb-header svg { width: 13px; height: 13px; flex-shrink: 0; stroke: currentColor; }
  .wb-header-title svg { width: auto; height: auto; }
  .wb-header .wb-section-btn svg { width: 16px; height: 16px; }

  /* Single editor area below the header. Phase label + auto-save state on
     the left, Monaco fills the rest. */
  .plan-body {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: var(--surface-2);
  }
  .plan-statusbar {
    height: 26px;
    padding: 0 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-2);
    color: var(--text-faint);
    font-size: 11.5px;
    font-family: var(--font-mono);
    flex-shrink: 0;
  }
  .plan-phase-label { color: var(--text-2); font-weight: 600; text-transform: lowercase; }
  .plan-path { color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; flex: 1; }
  .plan-saved { color: var(--accent); }
  .plan-dirty { color: var(--warning); }
  .plan-host { flex: 1; min-height: 0; position: relative; background: var(--surface-2); }
  .plan-empty {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-faint); font-size: 13px;
  }
</style>
</head>
<body>

  <div class="wb-shell">
    <header class="wb-header">
      <span class="wb-header-title"><span class="dot">.</span>Plan</span>
      <!-- Workdir controls inline in the header (same as Workbench). -->
      <button class="yo-workdir-btn" id="workdir-btn" title="Pick the working folder" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
        </svg>
        <span id="workdir-name">Pick a folder</span>
      </button>
      <span class="yo-workdir-branch" id="workdir-branch-wrap" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="6" cy="6" r="2"/>
          <circle cx="6" cy="18" r="2"/>
          <circle cx="18" cy="8" r="2"/>
          <path d="M6 8v8"/>
          <path d="M18 10v1a4 4 0 0 1-4 4H8"/>
        </svg>
        <span id="workdir-branch"></span>
      </span>
      <button class="yo-workdir-add" id="workdir-add-btn" title="Add folder" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
          <line x1="12" y1="11" x2="12" y2="17"/>
          <line x1="9" y1="14" x2="15" y2="14"/>
        </svg>
      </button>
      <span class="wb-header-spacer"></span>
      <!-- Five phase toggles: requirements → architecture → design → test → tasks. -->
      <div class="wb-section-toggles" id="plan-phases">
        <button class="wb-section-btn" data-phase="requirements" title="Requirements">
          <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        </button>
        <button class="wb-section-btn" data-phase="architecture" title="Architecture">
          <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        </button>
        <button class="wb-section-btn" data-phase="design" title="Design">
          <svg viewBox="0 0 24 24"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        </button>
        <button class="wb-section-btn" data-phase="test" title="Test">
          <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </button>
        <button class="wb-section-btn" data-phase="tasks" title="Tasks">
          <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/><line x1="3" y1="9" x2="6" y2="9"/><line x1="3" y1="13" x2="6" y2="13"/><line x1="3" y1="17" x2="6" y2="17"/></svg>
        </button>
      </div>
    </header>

    <div class="plan-body">
      <div class="plan-statusbar">
        <span class="plan-phase-label" id="plan-phase-label">requirements</span>
        <span class="plan-path" id="plan-path"></span>
        <span id="plan-savestate" class="plan-saved">saved</span>
      </div>
      <div class="plan-host" id="plan-host">
        <div class="plan-empty" id="plan-empty">Pick a working folder to begin.</div>
      </div>
    </div>
  </div>

  <script src="./plan.js"></script>
</body>
</html>
