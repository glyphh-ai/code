<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spec</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { height: 100%; }
  body {
    font-size: 14px; line-height: 1.5;
    background: var(--bg); color: var(--text);
    font-family: var(--font);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .spec-stub {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    text-align: center; padding: 32px;
  }
  .spec-logo {
    font-family: var(--font-mono);
    font-size: 56px; font-weight: 800;
    letter-spacing: -0.04em;
    color: var(--text);
  }
  .spec-logo .dot { color: var(--accent); }
  .spec-soon {
    font-size: 11px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .spec-desc {
    font-size: 14px; color: var(--text-2);
    max-width: 460px;
  }
  .spec-folder {
    font-family: var(--font-mono);
    font-size: 12px; color: var(--text-3);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="spec-stub">
    <div class="spec-logo"><span class="dot">.</span>Spec</div>
    <div class="spec-soon">Coming soon</div>
    <div class="spec-desc">
      The other half of dev — design + spec authoring as a workspace primitive.
      Pairs with Vibe.
    </div>
    <div class="spec-folder" id="spec-folder">no folder bound</div>
  </div>

  <script>
    (async () => {
      const api = window.spec;
      if (api && api.getTheme) {
        const t = await api.getTheme();
        const resolved = t === "system"
          ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : t;
        document.documentElement.setAttribute("data-theme", resolved);
      }
      if (api && api.onThemeChanged) {
        api.onThemeChanged((theme) => {
          document.documentElement.setAttribute("data-theme", theme);
        });
      }
      if (api && api.getWorkingDir) {
        try {
          const dir = await api.getWorkingDir();
          if (dir) document.getElementById("spec-folder").textContent = dir;
        } catch {}
      }
    })();
  </script>
</body>
</html>
