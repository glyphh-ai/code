<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 800; font-display: swap; src: url(fonts/Inter-latin.woff2) format('woff2'); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; color: #e0e0e0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    .grp-container { display: flex; flex-direction: column; height: 100%; }

    /* Header bar */
    .grp-header {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px; border-bottom: 1px solid #1a1a1a;
      background: #0d0d0d; flex-shrink: 0;
    }
    .grp-title { font-size: 13px; font-weight: 600; color: #fff; }
    .grp-title .dot { color: #25C75E; }
    .grp-participants { display: flex; gap: 6px; flex: 1; overflow-x: auto; padding: 2px 0; }
    .grp-chip {
      display: flex; align-items: center; gap: 4px;
      padding: 3px 10px 3px 8px; border-radius: 12px;
      font-size: 11px; font-weight: 500; white-space: nowrap;
      border: 1px solid #222; background: #141414; color: #aaa;
      transition: all 0.15s;
    }
    .grp-chip .chip-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .grp-chip .chip-remove {
      margin-left: 4px; cursor: pointer; opacity: 0; color: #666;
      font-size: 13px; line-height: 1; transition: opacity 0.15s;
    }
    .grp-chip:hover .chip-remove { opacity: 1; }
    .grp-chip:hover .chip-remove:hover { color: #ff6b6b; }
    .grp-chip.typing { border-color: #25C75E44; }
    .grp-chip.typing .chip-dot { animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .grp-add-btn {
      background: none; border: 1px dashed #333; color: #555;
      border-radius: 12px; padding: 3px 10px; font-size: 11px;
      cursor: pointer; white-space: nowrap; transition: all 0.15s;
    }
    .grp-add-btn:hover { border-color: #25C75E; color: #25C75E; }

    /* Messages area */
    .grp-messages {
      flex: 1; overflow-y: auto; padding: 16px;
      display: flex; flex-direction: column; gap: 4px;
    }

    .grp-msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.55; word-wrap: break-word; white-space: pre-wrap; }

    .grp-msg-user {
      align-self: flex-end; background: #1a2a1e; color: #d0d0d0;
      border-bottom-right-radius: 4px;
    }

    .grp-msg-model {
      align-self: flex-start; background: #141414;
      border: 1px solid #1a1a1a; border-bottom-left-radius: 4px;
      max-width: 90%;
    }
    .grp-msg-model .grp-msg-header {
      display: flex; align-items: center; gap: 6px;
      margin-bottom: 6px; font-size: 11px; font-weight: 600;
    }
    .grp-msg-model .grp-msg-header .model-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .grp-msg-model .grp-msg-body { color: #ccc; }

    .grp-msg-system {
      align-self: center; color: #555; font-size: 11px;
      padding: 4px 12px; background: #111; border-radius: 8px;
      margin: 8px 0;
    }

    /* Typing indicator */
    .grp-typing-row {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 14px; font-size: 11px; color: #555;
    }
    .grp-typing-dots span {
      display: inline-block; width: 4px; height: 4px;
      background: #555; border-radius: 50%; margin: 0 1px;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .grp-typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .grp-typing-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-4px); } }

    /* Input bar */
    .grp-input-bar {
      display: flex; align-items: flex-end; gap: 8px;
      padding: 12px 16px; border-top: 1px solid #1a1a1a;
      background: #0d0d0d; flex-shrink: 0;
    }
    .grp-input {
      flex: 1; background: #141414; border: 1px solid #222;
      border-radius: 10px; color: #e0e0e0; font-family: inherit;
      font-size: 13px; padding: 10px 14px; resize: none;
      min-height: 40px; max-height: 120px; line-height: 1.4;
      outline: none; transition: border-color 0.15s;
    }
    .grp-input:focus { border-color: #25C75E; }
    .grp-input::placeholder { color: #444; }
    .grp-input:disabled { opacity: 0.4; cursor: not-allowed; }
    .grp-send-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: #25C75E; border: none; color: #000;
      font-size: 16px; font-weight: 700; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.15s;
    }
    .grp-send-btn:hover { background: #2dd96b; }
    .grp-send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Welcome state */
    .grp-welcome {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      color: #444; font-size: 13px;
    }
    .grp-welcome-title { font-size: 20px; font-weight: 600; color: #fff; }
    .grp-welcome-title .dot { color: #25C75E; }
  </style>
</head>
<body>
  <div class="grp-container">
    <div class="grp-header">
      <span class="grp-title"><span class="dot">.</span>grp</span>
      <div class="grp-participants" id="participants"></div>
      <button class="grp-add-btn" id="add-btn">+ add</button>
    </div>
    <div class="grp-messages" id="messages">
      <div class="grp-welcome" id="welcome">
        <div class="grp-welcome-title"><span class="dot">.</span>grp</div>
        <div>group chat with AI models</div>
        <div style="margin-top: 8px; color: #333; font-size: 11px;">type a message to start the conversation</div>
      </div>
    </div>
    <div class="grp-input-bar">
      <textarea class="grp-input" id="input" placeholder="Message everyone..." rows="1"></textarea>
      <button class="grp-send-btn" id="send-btn">&uarr;</button>
    </div>
  </div>

  <script>
    // Model color palette — consistent per model name
    const MODEL_COLORS = {
      claude: "#D97706", gemini: "#4285F4", gpt: "#10A37F", chatgpt: "#10A37F",
      grok: "#1DA1F2", perplexity: "#20B2AA", copilot: "#6366F1",
      mistral: "#FF6B35", llama: "#8B5CF6", deepseek: "#06B6D4",
    };
    function modelColor(id) {
      return MODEL_COLORS[id] || "#" + ((id.split("").reduce((a, c) => a + c.charCodeAt(0), 0) * 2654435761 >>> 0) % 0xFFFFFF).toString(16).padStart(6, "0");
    }

    const messagesEl = document.getElementById("messages");
    const participantsEl = document.getElementById("participants");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send-btn");
    const addBtn = document.getElementById("add-btn");
    const welcomeEl = document.getElementById("welcome");
    const typingModels = new Set();
    let waiting = false;

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function hideWelcome() {
      if (welcomeEl) welcomeEl.remove();
    }

    function renderParticipants(list) {
      participantsEl.innerHTML = "";
      for (const id of list) {
        const chip = document.createElement("div");
        chip.className = "grp-chip" + (typingModels.has(id) ? " typing" : "");
        chip.dataset.id = id;
        const dot = document.createElement("span");
        dot.className = "chip-dot";
        dot.style.background = modelColor(id);
        chip.appendChild(dot);
        chip.appendChild(document.createTextNode(id));
        const x = document.createElement("span");
        x.className = "chip-remove";
        x.textContent = "\u00D7";
        x.addEventListener("click", (e) => { e.stopPropagation(); window.grpAPI.removeParticipant(id); });
        chip.appendChild(x);
        participantsEl.appendChild(chip);
      }
    }

    function addMessage(msg) {
      hideWelcome();
      if (msg.type === "user") {
        const el = document.createElement("div");
        el.className = "grp-msg grp-msg-user";
        el.textContent = msg.text;
        messagesEl.appendChild(el);
      } else if (msg.type === "model") {
        const el = document.createElement("div");
        el.className = "grp-msg grp-msg-model";
        const header = document.createElement("div");
        header.className = "grp-msg-header";
        const dot = document.createElement("span");
        dot.className = "model-dot";
        dot.style.background = modelColor(msg.from);
        header.appendChild(dot);
        header.appendChild(document.createTextNode(msg.from));
        el.appendChild(header);
        const body = document.createElement("div");
        body.className = "grp-msg-body";
        body.textContent = msg.text;
        el.appendChild(body);
        messagesEl.appendChild(el);
      } else {
        const el = document.createElement("div");
        el.className = "grp-msg grp-msg-system";
        el.textContent = msg.text;
        messagesEl.appendChild(el);
      }
      scrollBottom();
    }

    function setWaiting(w) {
      waiting = w;
      inputEl.disabled = w;
      sendBtn.disabled = w;
    }

    function send() {
      const text = inputEl.value.trim();
      if (!text || waiting) return;
      inputEl.value = "";
      autoGrow();
      addMessage({ from: "you", text, type: "user" });
      setWaiting(true);
      window.grpAPI.send(text);
    }

    function autoGrow() {
      inputEl.style.height = "40px";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
    }

    // Event listeners
    sendBtn.addEventListener("click", send);
    inputEl.addEventListener("input", autoGrow);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });

    addBtn.addEventListener("click", () => {
      const id = prompt("Add model (e.g. claude, gemini, grok):");
      if (id?.trim()) window.grpAPI.addParticipant(id.trim().toLowerCase());
    });

    // IPC listeners
    window.grpAPI.onMessage((msg) => {
      addMessage(msg);
      // Re-enable input when last model responds (system message "all responded")
      if (msg.type === "system" && msg.text.includes("responded")) {
        setWaiting(false);
        inputEl.focus();
      }
    });

    window.grpAPI.onParticipantsChanged((list) => {
      renderParticipants(list);
    });

    window.grpAPI.onTyping((modelId, typing) => {
      if (typing) typingModels.add(modelId); else typingModels.delete(modelId);
      // Update chip styling
      const chip = participantsEl.querySelector(`[data-id="${modelId}"]`);
      if (chip) chip.classList.toggle("typing", typing);
    });

    window.grpAPI.onVisible(() => {
      window.grpAPI.getParticipants().then(renderParticipants);
    });

    // Init
    window.grpAPI.getParticipants().then(renderParticipants);
    inputEl.focus();
  </script>
</body>
</html>
