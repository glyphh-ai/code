<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: 'Inter'; font-style: normal; font-weight: 400 800; font-display: swap; src: url(fonts/Inter-latin.woff2) format('woff2'); }
    @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400 700; font-display: swap; src: url(fonts/JetBrainsMono-latin.woff2) format('woff2'); }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow-y: auto; overflow-x: hidden; background: #0a0a0a; color: #e0e0e0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(37, 199, 94, 0.3); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(37, 199, 94, 0.6); }

    .dashboard { max-width: 900px; margin: 0 auto; padding: 32px 24px 48px; }

    /* Header */
    .dash-header { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .dash-title { font-size: 22px; font-weight: 600; color: #fff; }
    .dash-title .dot { color: #25C75E; }
    .dash-provider { font-size: 11px; color: #666; background: #161616; padding: 4px 10px; border-radius: 6px; margin-left: auto; }

    /* Stat cards */
    .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .stat-card { background: #111; border: 1px solid #1a1a1a; border-radius: 10px; padding: 16px 18px; }
    .stat-label { font-size: 11px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
    .stat-values { display: flex; gap: 20px; }
    .stat-item { display: flex; flex-direction: column; }
    .stat-num { font-size: 22px; font-weight: 600; color: #fff; line-height: 1.2; }
    .stat-sub { font-size: 10px; color: #555; margin-top: 2px; }
    .stat-num.green { color: #25C75E; }

    /* Section headings */
    .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; margin-top: 28px; }
    .section-title { font-size: 13px; font-weight: 600; color: #999; text-transform: uppercase; letter-spacing: 0.5px; }
    .range-toggle { margin-left: auto; display: flex; gap: 0; }
    .range-btn { background: #161616; border: 1px solid #222; color: #666; font-size: 11px; padding: 3px 10px; cursor: pointer; transition: all 0.15s; }
    .range-btn:first-child { border-radius: 4px 0 0 4px; }
    .range-btn:last-child { border-radius: 0 4px 4px 0; }
    .range-btn.active { background: #1a2a1e; border-color: #25C75E44; color: #25C75E; }
    .range-btn:hover:not(.active) { color: #aaa; }

    /* Charts */
    .chart-container { background: #111; border: 1px solid #1a1a1a; border-radius: 10px; padding: 18px; margin-bottom: 16px; }
    .chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .chart-box { height: 220px; position: relative; }

    /* Apps grid */
    .apps-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .app-card { display: flex; align-items: center; gap: 12px; background: #111; border: 1px solid #1a1a1a; border-radius: 8px; padding: 12px 14px; transition: border-color 0.15s; }
    .app-card:hover { border-color: #333; }
    .app-icon { flex-shrink: 0; opacity: 0.7; }
    .app-info { flex: 1; min-width: 0; }
    .app-name { font-size: 13px; font-weight: 500; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .app-date { font-size: 10px; color: #555; margin-top: 2px; }
    .app-actions { display: flex; gap: 6px; }
    .app-actions button { background: none; border: none; color: #555; cursor: pointer; padding: 4px; border-radius: 4px; transition: all 0.15s; }
    .app-actions button:hover { color: #25C75E; background: #1a2a1e; }
    .app-delete:hover { color: #ff6b6b !important; background: #2a1a1a !important; }

    /* Reminders */
    .reminders-list { display: flex; flex-direction: column; gap: 6px; }
    .reminder-row { display: flex; align-items: center; gap: 12px; background: #111; border: 1px solid #1a1a1a; border-radius: 8px; padding: 10px 14px; }
    .reminder-msg { flex: 1; font-size: 13px; color: #ddd; }
    .reminder-time { font-size: 11px; color: #25C75E; font-variant-numeric: tabular-nums; }
    .reminder-cancel { background: none; border: none; color: #555; cursor: pointer; padding: 4px; border-radius: 4px; transition: all 0.15s; }
    .reminder-cancel:hover { color: #ff6b6b; background: #2a1a1a; }

    /* Empty state */
    .empty-hint { font-size: 12px; color: #444; padding: 16px; text-align: center; }

    /* Responsive */
    @media (max-width: 600px) {
      .stat-row, .chart-row, .apps-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- Header -->
    <div class="dash-header">
      <div class="dash-title"><span class="dot">.</span>Yo Dashboard</div>
      <div class="dash-provider" id="stat-provider">—</div>
    </div>

    <!-- Stat cards -->
    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">Today</div>
        <div class="stat-values">
          <div class="stat-item">
            <div class="stat-num green" id="stat-today-input">0</div>
            <div class="stat-sub">Input tokens</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="stat-today-output">0</div>
            <div class="stat-sub">Output tokens</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="stat-today-calls">0</div>
            <div class="stat-sub">Calls</div>
          </div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-label">All Time</div>
        <div class="stat-values">
          <div class="stat-item">
            <div class="stat-num green" id="stat-alltime-input">0</div>
            <div class="stat-sub">Input tokens</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="stat-alltime-output">0</div>
            <div class="stat-sub">Output tokens</div>
          </div>
          <div class="stat-item">
            <div class="stat-num" id="stat-alltime-calls">0</div>
            <div class="stat-sub">Calls</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Charts -->
    <div class="chart-row">
      <div class="chart-container">
        <div class="stat-label">Token Usage by Agent</div>
        <div class="chart-box">
          <canvas id="chart-agents"></canvas>
        </div>
      </div>
      <div class="chart-container">
        <div style="display:flex;align-items:center;margin-bottom:8px;">
          <div class="stat-label" style="margin-bottom:0">Usage History</div>
          <div class="range-toggle" style="margin-left:auto">
            <button class="range-btn active" id="range-7">7d</button>
            <button class="range-btn" id="range-30">30d</button>
          </div>
        </div>
        <div class="chart-box">
          <canvas id="chart-history"></canvas>
        </div>
      </div>
    </div>

    <!-- Apps -->
    <div class="section-head">
      <div class="section-title">Apps</div>
    </div>
    <div id="apps-grid" class="apps-grid">
      <div class="empty-hint">No apps yet. Ask .yo to build one!</div>
    </div>

    <!-- Reminders -->
    <div class="section-head">
      <div class="section-title">Active Reminders</div>
    </div>
    <div id="reminders-list" class="reminders-list">
      <div class="empty-hint">No active reminders.</div>
    </div>
  </div>

  <script src="dashboard-bundle.js"></script>
</body>
</html>
