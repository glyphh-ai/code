<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vibe</title>
<link rel="stylesheet" href="styles.css">
<script>
  // Apply theme synchronously before first paint (matches the rest of the
  // app — reads from localStorage which the main renderer keeps in sync).
  try {
    var t = localStorage.getItem("yoTheme") || "light";
    var r = t === "system"
      ? (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
      : t;
    document.documentElement.setAttribute("data-theme", r);
  } catch (e) {}
</script>
<style>
  html, body { height: 100%; }
  body {
    font-size: 14px; line-height: 1.5;
    background: var(--surface-2); color: var(--text);
    font-family: var(--font-sans);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .vibe-stub {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    text-align: center; padding: 32px;
  }
  .vibe-logo {
    font-family: var(--font-mono);
    font-size: 56px; font-weight: 800;
    letter-spacing: -0.04em;
    color: var(--text);
  }
  .vibe-logo .dot { color: var(--accent); }
  .vibe-soon {
    font-size: 11px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .vibe-desc {
    font-size: 14px; color: var(--text-2);
    max-width: 460px;
  }
  .vibe-folder {
    font-family: var(--font-mono);
    font-size: 12px; color: var(--text-3);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    margin-top: 8px;
  }
</style>
</head>
<body>
  <div class="vibe-stub">
    <div class="vibe-logo"><span class="dot">.</span>Vibe</div>
    <div class="vibe-soon">Coming soon</div>
    <div class="vibe-desc">
      Spec-driven coding with Claude in your repo. The dev plane that pairs with .Spec.
    </div>
    <div class="vibe-folder" id="vibe-folder">no folder bound</div>
  </div>

  <script>
    (async () => {
      const api = window.vibe;
      if (api && api.onThemeChanged) {
        api.onThemeChanged((theme) => {
          document.documentElement.setAttribute("data-theme", theme);
        });
      }
      if (api && api.getWorkingDir) {
        try {
          const dir = await api.getWorkingDir();
          if (dir) document.getElementById("vibe-folder").textContent = dir;
        } catch {}
      }
    })();
  </script>
</body>
</html>
